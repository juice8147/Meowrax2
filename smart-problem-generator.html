<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Math &amp; Physics Problem Generator</title>
<meta name="description" content="สุ่มโจทย์คณิตศาสตร์และฟิสิกส์ ม.1–ม.6 พร้อมเฉลยทีละขั้น วินิจฉัยจุดที่ผิด และปรับความยากตามจุดอ่อน">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7fb; --surface:#ffffff; --surface-2:#eef2f8; --text:#0f172a; --muted:#475569; --border:#d9e1ec;
  --primary:#4338ca; --primary-hover:#3730a3; --primary-ink:#ffffff; --primary-soft:#e0e7ff;
  --math:#0369a1; --math-soft:#e0f2fe; --phys:#c2410c; --phys-soft:#ffedd5;
  --ok:#15803d; --ok-bg:#dcfce7; --err:#b91c1c; --err-bg:#fee2e2; --warn:#92400e; --warn-bg:#fef3c7; --info:#1e40af; --info-bg:#dbeafe;
  --diagram-fill:#e0e7ff; --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
  --radius:16px; --font:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1120; --surface:#111a2e; --surface-2:#18233b; --text:#e2e8f0; --muted:#a3b1c6; --border:#26324a;
    --primary:#818cf8; --primary-hover:#a5b4fc; --primary-ink:#0b1120; --primary-soft:#1e2550;
    --math:#38bdf8; --math-soft:#0c2a3d; --phys:#fb923c; --phys-soft:#3a1f0d;
    --ok:#4ade80; --ok-bg:#0f2e1d; --err:#f87171; --err-bg:#3b1414; --warn:#fbbf24; --warn-bg:#33290a; --info:#93c5fd; --info-bg:#132447;
    --diagram-fill:#1e2550; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1120; --surface:#111a2e; --surface-2:#18233b; --text:#e2e8f0; --muted:#a3b1c6; --border:#26324a;
  --primary:#818cf8; --primary-hover:#a5b4fc; --primary-ink:#0b1120; --primary-soft:#1e2550;
  --math:#38bdf8; --math-soft:#0c2a3d; --phys:#fb923c; --phys-soft:#3a1f0d;
  --ok:#4ade80; --ok-bg:#0f2e1d; --err:#f87171; --err-bg:#3b1414; --warn:#fbbf24; --warn-bg:#33290a; --info:#93c5fd; --info-bg:#132447;
  --diagram-fill:#1e2550; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* header */
.app-bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.app-bar .inner{max-width:1440px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:40px;height:40px;border-radius:12px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;flex:none}
.brand h1{font-size:1.05rem;margin:0;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;cursor:pointer;font-weight:600;font-size:.9rem;transition:background .15s,border-color .15s}
.icon-btn:hover{background:var(--surface-2)}

/* layout */
.layout{max-width:1440px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.layout{grid-template-columns:290px minmax(0,1fr)} #insights{grid-column:1 / -1}}
@media (min-width:1240px){.layout{grid-template-columns:290px minmax(0,1fr) 330px;align-items:start} #insights{grid-column:auto} #settings,#insights{position:sticky;top:78px;max-height:calc(100vh - 94px);overflow:auto}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h2{font-size:1rem;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 .i{color:var(--primary)}
fieldset{border:0;padding:0;margin:0 0 18px;min-width:0}
legend{font-weight:600;font-size:.9rem;margin-bottom:8px;padding:0;color:var(--text)}
.hint-text{font-size:.8rem;color:var(--muted)}

/* toggles */
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--primary)}
.chip[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--text)}
.chip[aria-pressed="true"]::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary)}
.chip.grade{min-width:52px;justify-content:center;padding:0 10px}
.chip.grade[aria-pressed="true"]::before{display:none}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:9px;cursor:pointer;font-size:.9rem;font-weight:500;text-align:center;padding:0 6px;transition:background .15s}
.seg input:checked+label{background:var(--surface);box-shadow:var(--shadow);color:var(--primary);font-weight:700}
.seg input:focus-visible+label{outline:3px solid var(--primary);outline-offset:1px}
.topic-tools{display:flex;gap:12px;margin-bottom:6px}
.link-btn{background:none;border:0;color:var(--primary);cursor:pointer;font-weight:600;font-size:.85rem;padding:8px 0;min-height:36px}
.topic-list{display:flex;flex-direction:column;gap:2px;max-height:none}
.topic-item{display:flex;align-items:center;gap:10px;min-height:40px;padding:4px 8px;border-radius:10px;cursor:pointer}
.topic-item:hover{background:var(--surface-2)}
.topic-item input{width:18px;height:18px;accent-color:var(--primary);flex:none}
.topic-item .tg{margin-left:auto;font-size:.75rem;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.math{background:var(--math)} .dot.physics{background:var(--phys)}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer;min-height:44px}
.switch input{position:absolute;opacity:0}
.switch .track{width:44px;height:26px;border-radius:999px;background:var(--border);position:relative;flex:none;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+.track{background:var(--primary)}
.switch input:checked+.track::after{transform:translateX(18px)}
.switch input:focus-visible+.track{outline:3px solid var(--primary);outline-offset:2px}

/* problem */
.workspace{display:flex;flex-direction:column;gap:16px;min-width:0}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--text)}
.badge.math{background:var(--math-soft);color:var(--math)} .badge.physics{background:var(--phys-soft);color:var(--phys)}
.badge.lv1{background:var(--ok-bg);color:var(--ok)} .badge.lv2{background:var(--warn-bg);color:var(--warn)} .badge.lv3{background:var(--err-bg);color:var(--err)}
.reason{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin:0 0 12px}
.reason .i{width:16px;height:16px;color:var(--primary)}
.question{font-size:1.2rem;line-height:1.75;margin:0 0 6px;overflow-wrap:anywhere}
.note{font-size:.88rem;color:var(--muted);margin:0 0 12px}
.ex{font-family:var(--mono);font-size:.95em;background:var(--surface-2);padding:1px 6px;border-radius:6px;white-space:nowrap}
.eqs{display:inline-flex;flex-direction:column;gap:4px;margin:6px 0}
.diagram{margin:8px 0 14px;background:var(--surface-2);border-radius:12px;padding:8px;display:flex;justify-content:center}
.diagram:empty{display:none}
.diagram svg{width:100%;max-width:420px;height:auto}
.diagram text{fill:var(--text);font-family:var(--mono);font-size:14px}
.d-shape{fill:var(--diagram-fill);stroke:var(--primary);stroke-width:2.5;stroke-linejoin:round}
.d-line{stroke:var(--muted);stroke-width:2;fill:none}
.d-wire{stroke:var(--text);stroke-width:2.5;fill:none}
.d-path{stroke:var(--primary);stroke-width:2.5;fill:none;stroke-dasharray:6 6}
.d-fill{fill:var(--diagram-fill);stroke:var(--primary);stroke-width:2}
.d-res{fill:var(--surface);stroke:var(--text);stroke-width:2.5}
.d-cover{fill:var(--surface-2)}
.d-accent{fill:var(--phys)!important;font-weight:600}
.d-dot{fill:var(--phys)}
.d-arrow{stroke:var(--phys);stroke-width:2.5;fill:none}
.answer-form{display:grid;gap:8px;margin-top:6px}
.answer-form label.lbl{font-weight:600;font-size:.9rem}
.answer-row{display:flex;flex-wrap:wrap;gap:8px}
.answer-row input[type=text]{flex:1 1 180px;min-width:0;min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-family:var(--mono);font-size:1.1rem}
.answer-row input[type=text]:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
.answer-row input[aria-invalid="true"]{border-color:var(--err)}
.answer-row select{min-height:48px;padding:0 12px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);flex:0 1 140px;min-width:110px}
.suffix{align-self:center;color:var(--muted);font-weight:500}
.field-error{color:var(--err);font-size:.85rem;margin:0;min-height:0}
.photo-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.photo-thumb,.work-photo{display:block;max-width:100%;max-height:240px;border-radius:10px;border:1px solid var(--border,currentColor);object-fit:contain}
.work-photo{margin:8px 0}
.self-grade{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:background .15s,transform .1s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn.pulse{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
kbd{font-family:var(--mono);font-size:.7rem;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:var(--surface-2)}
.btn-primary kbd{background:transparent;color:inherit;border-color:currentColor}

/* feedback */
.feedback{display:flex;flex-direction:column;gap:10px}
.fb{border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;animation:rise .25s ease-out}
.fb .i{margin-top:3px}
.fb h3{margin:0 0 2px;font-size:1rem}
.fb p{margin:0;font-size:.92rem}
.fb.ok{background:var(--ok-bg);color:var(--ok)} .fb.err{background:var(--err-bg);color:var(--err)}
.fb.warn{background:var(--warn-bg);color:var(--warn)} .fb.info{background:var(--info-bg);color:var(--info)}
.fb .body{color:var(--text)}
.fb .body h3{color:inherit}
.fb.ok h3{color:var(--ok)} .fb.err h3{color:var(--err)} .fb.warn h3{color:var(--warn)} .fb.info h3{color:var(--info)}
.solution h2 .count{margin-left:auto;font-weight:500;font-size:.85rem;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;position:relative;padding:10px 12px 10px 48px;border-radius:12px;background:var(--surface-2);animation:rise .25s ease-out;overflow-wrap:anywhere}
.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--primary);color:var(--primary-ink);font-size:.8rem;font-weight:700;display:grid;place-items:center}
.steps li.flag{background:var(--err-bg)}
.steps li.flag::before{background:var(--err);color:#fff}
.steps li .flag-note{display:block;font-size:.8rem;font-weight:600;color:var(--err);margin-top:4px}
.steps li.final{background:var(--ok-bg)}
.steps li.final::before{content:"✓";background:var(--ok);color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* insights */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tile{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.tile b{display:block;font-family:var(--mono);font-size:1.35rem;line-height:1.2}
.tile span{font-size:.75rem;color:var(--muted)}
.sub-h{font-size:.85rem;font-weight:700;margin:4px 0 8px;color:var(--muted);text-transform:none}
.bars{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:10px}
.bars li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:.85rem}
.bars .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.bars .pct{font-family:var(--mono);font-weight:600}
.bars .track{grid-column:1 / -1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bars .fill{height:100%;border-radius:99px;transition:width .4s ease}
.bars .sub{grid-column:1 / -1;font-size:.75rem;color:var(--muted)}
.fill.lo{background:var(--err)} .fill.mid{background:var(--warn)} .fill.hi{background:var(--ok)}
.mk-list{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:8px}
.mk-list li{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:.85rem}
.mk-list .row{display:flex;gap:8px;align-items:baseline}
.mk-list b{font-weight:600}
.mk-list .n{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--err)}
.mk-list p{margin:2px 0 0;color:var(--muted);font-size:.8rem}
.empty{font-size:.85rem;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:12px;margin:0 0 16px}
.ins-actions{display:flex;flex-wrap:wrap;gap:8px}
.ins-actions .btn{flex:1 1 140px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
footer{max-width:1440px;margin:0 auto;padding:0 16px 24px;color:var(--muted);font-size:.8rem;text-align:center}
@media (max-width:520px){.brand p{display:none}.question{font-size:1.08rem}.btn{flex:1 1 auto}.icon-btn .lbl{display:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ic-logo" viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 15c2-6 4-8 6-8s3 3 5 3"/><circle cx="18" cy="10" r="1.5"/></symbol>

    <symbol id="ic-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>

    <symbol id="ic-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16v-7"/></symbol>
    <symbol id="ic-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="ic-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/></symbol>
    <symbol id="ic-camera" viewBox="0 0 24 24"><path d="M14.5 4h-5L8 6H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="ic-list"viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  </defs>
</svg>

<header class="app-bar">
  <div class="inner">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg class="i"><use href="#ic-logo"/></svg></div>
      <div style="min-width:0">
        <h1>Smart Math &amp; Physics Problem Generator</h1>
        <p data-i18n="tagline"></p>
      </div>
    </div>
    <button class="icon-btn" id="langBtn" type="button"><svg class="i" aria-hidden="true"><use href="#ic-lang"/></svg><span id="langLbl">EN</span></button>
    <button class="icon-btn" id="themeBtn" type="button"><svg class="i" aria-hidden="true"><use id="themeIcon" href="#ic-moon"/></svg></button>
  </div>
</header>

<main class="layout">
  <!-- Settings -->
  <aside class="card" id="settings" aria-labelledby="setH">
    <h2 id="setH"><svg class="i" aria-hidden="true"><use href="#ic-sliders"/></svg><span data-i18n="settings"></span></h2>
    <fieldset>
      <legend data-i18n="subject"></legend>
      <div class="chip-row" id="subjects"></div>
    </fieldset>
    <fieldset>

const r2 = (x, d = 2) => Math.round(x * 10 ** d) / 10 ** d;

const sg = n => (n < 0 ? `− ${-n}` : `+ ${n}`);

const fracStr = (n, d) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); n /= g; d /= g; return d === 1 ? n2s(n) : `${n2s(n)}/${d}`; };

// polynomial from [[coef, power], ...] high → low
function poly(cs, v = 'x') {
  let out = '';
  for (const [c, p] of cs) {

    const a = Math.abs(c);
    const body = p === 0 ? `${a}` : `${a === 1 ? '' : a}${v}${p > 1 ? sup(p) : ''}`;
    out += out === '' ? (c < 0 ? '−' : '') + body : (c < 0 ? ` − ${body}` : ` + ${body}`);
  }

function svgCircuit({ kind = 'single', V = '', R = [] }) {

}

def({ id: 'int', subject: 'math', grades: [1], name: L('จำนวนเต็มและลำดับการคำนวณ', 'Integers & order of operations'), gen(lv) {
  let a, b, c, expr, ans, steps, mistakes;
  if (lv === 1) {
    a = ri(2, 20); b = ri(2, 12); c = ri(2, 12); ans = a + b * c; expr = `${a} + ${b} × ${c}`;
    steps = [L(`คูณก่อนบวก: ${ex(`${b} × ${c} = ${b * c}`)}`, `Multiply before adding: ${ex(`${b} × ${c} = ${b * c}`)}`), L(`${ex(`${a} + ${b * c} = ${ans}`)}`)];
    mistakes = [{ tag: 'order-ops', value: (a + b) * c, step: 0 }];
  } else if (lv === 2) {
    a = ri(-20, 20); b = nz(-9, 9, [0, 1]); c = ri(2, 9); ans = a - b * c; expr = `${n2s(a)} − ${neg(b)} × ${c}`;
    steps = [L(`คูณก่อน: ${ex(`${neg(b)} × ${c} = ${n2s(b * c)}`)}`, `Multiply first: ${ex(`${neg(b)} × ${c} = ${n2s(b * c)}`)}`),
      L(`${ex(`${n2s(a)} − ${neg(b * c)}`)} ${b * c < 0 ? '(ลบด้วยจำนวนลบ = บวก)' : ''} = ${ex(n2s(ans))}`, `${ex(`${n2s(a)} − ${neg(b * c)}`)} ${b * c < 0 ? '(minus a negative = plus)' : ''} = ${ex(n2s(ans))}`)];
    mistakes = [{ tag: 'order-ops', value: (a - b) * c, step: 0 }, { tag: 'sign', value: a + b * c, step: 1 }];
  } else {
    a = ri(10, 80); b = ri(2, 6); c = ri(3, 7); ans = a - b * c * c; expr = `${a} − ${b} × ${c}${sup(2)}`;
    steps = [L(`เลขยกกำลังก่อน: ${ex(`${c}${sup(2)} = ${c * c}`)}`, `Powers first: ${ex(`${c}${sup(2)} = ${c * c}`)}`), L(`คูณ: ${ex(`${b} × ${c * c} = ${b * c * c}`)}`, `Multiply: ${ex(`${b} × ${c * c} = ${b * c * c}`)}`), L(`ลบ: ${ex(`${a} − ${b * c * c} = ${n2s(ans)}`)}`, `Subtract: ${ex(`${a} − ${b * c * c} = ${n2s(ans)}`)}`)];
    mistakes = [{ tag: 'order-ops', value: (a - b) * c * c, step: 1 }, { tag: 'power-as-multiply', value: a - b * c * 2, step: 0 }, { tag: 'order-ops', value: a - (b * c) ** 2, step: 1 }];
  }
  return { text: L(`จงหาค่าของ ${ex(expr)}`, `Evaluate ${ex(expr)}`), answer: ans, steps, mistakes, hint: L('ลำดับ: วงเล็บ → ยกกำลัง → คูณ/หาร → บวก/ลบ', 'Order: brackets → powers → × ÷ → + −') };
}});

def({ id: 'frac', subject: 'math', grades: [1], name: L('เศษส่วน', 'Fractions'), gen(lv) {
  const note = L('ตอบเป็นเศษส่วนอย่างต่ำ (เช่น 5/6) หรือทศนิยม', 'Answer as a fraction in lowest terms (e.g. 5/6) or a decimal');
  if (lv < 3) {
    const b = ri(2, lv === 1 ? 6 : 10), d = nz(2, lv === 1 ? 6 : 10, [b]), a = ri(1, b - 1), c = ri(1, d - 1), op = lv === 1 ? 1 : pick([1, -1]);
    const m = lcm(b, d), A = a * m / b, C = c * m / d, N = A + op * C, o = op > 0 ? '+' : '−';
    const mistakes = [];
    if (b + op * d !== 0) mistakes.push({ tag: 'fraction-add', value: (a + op * c) / (b + op * d), step: 0 });
    return { text: L(`จงหาค่าของ ${ex(`${a}/${b} ${o} ${c}/${d}`)}`, `Evaluate ${ex(`${a}/${b} ${o} ${c}/${d}`)}`), note, answer: N / m, answerText: fracStr(N, m),
      steps: [L(`ค.ร.น. ของตัวส่วน ${b} และ ${d} คือ ${m}`, `The LCM of denominators ${b} and ${d} is ${m}`),
        L(`ทำตัวส่วนให้เท่ากัน: ${ex(`${a}/${b} = ${A}/${m}`)}, ${ex(`${c}/${d} = ${C}/${m}`)}`, `Common denominator: ${ex(`${a}/${b} = ${A}/${m}`)}, ${ex(`${c}/${d} = ${C}/${m}`)}`),
        L(`${op > 0 ? 'บวก' : 'ลบ'}เฉพาะตัวเศษ: ${ex(`(${A} ${o} ${C})/${m} = ${n2s(N)}/${m}`)}`, `${op > 0 ? 'Add' : 'Subtract'} numerators: ${ex(`(${A} ${o} ${C})/${m} = ${n2s(N)}/${m}`)}`),
        L(`ทำเป็นเศษส่วนอย่างต่ำ: ${ex(fracStr(N, m))}`, `Lowest terms: ${ex(fracStr(N, m))}`)],
      mistakes, hint: L('ทำตัวส่วนให้เท่ากันก่อน แล้วค่อยบวก/ลบตัวเศษ', 'Find a common denominator before adding/subtracting') };
  }
  const a = ri(1, 9), b = nz(2, 9, [a]), c = ri(1, 9), d = nz(2, 9, [c]);
  return { text: L(`จงหาค่าของ ${ex(`${a}/${b} ÷ ${c}/${d}`)}`, `Evaluate ${ex(`${a}/${b} ÷ ${c}/${d}`)}`), note, answer: (a * d) / (b * c), answerText: fracStr(a * d, b * c),
    steps: [L(`เปลี่ยนหารเป็นคูณด้วยส่วนกลับของตัวหาร: ${ex(`${a}/${b} × ${d}/${c}`)}`, `Change ÷ to × by the reciprocal of the divisor: ${ex(`${a}/${b} × ${d}/${c}`)}`),
      L(`คูณเศษกับเศษ ส่วนกับส่วน: ${ex(`${a * d}/${b * c}`)}`, `Multiply across: ${ex(`${a * d}/${b * c}`)}`), L(`อย่างต่ำ: ${ex(fracStr(a * d, b * c))}`, `Lowest terms: ${ex(fracStr(a * d, b * c))}`)],
    mistakes: [{ tag: 'fraction-div', value: (a * c) / (b * d), step: 0 }, { tag: 'fraction-div', value: (b * c) / (a * d), step: 0 }],
    hint: L('หารด้วยเศษส่วน = คูณด้วยส่วนกลับ', 'Divide by a fraction = multiply by its reciprocal') };
}});

def({ id: 'linear', subject: 'math', grades: [1, 2], name: L('สมการเชิงเส้นตัวแปรเดียว', 'Linear equations'), gen(lv) {
  const x = ri(-10, 10);
  if (lv < 3) {
    const a = lv === 1 ? ri(2, 9) : nz(-9, 9, [0, 1, -1]), b = nz(-20, 20), c = a * x + b;
    const mistakes = [{ tag: 'transpose-sign', value: (c + b) / a, step: 0 }, { tag: 'inverse-op', value: (c - b) * a, step: 1 }];
    if (lv === 2) mistakes.push({ tag: 'sign', value: -x, step: 1 });
    return { text: L(`จงแก้สมการ ${ex(`${poly([[a, 1], [b, 0]])} = ${n2s(c)}`)} หาค่า x`, `Solve ${ex(`${poly([[a, 1], [b, 0]])} = ${n2s(c)}`)} for x`), answer: x,
      steps: [L(`ย้าย ${ex(sg(b))} ไปอีกข้าง (เปลี่ยนเครื่องหมาย): ${ex(`${poly([[a, 1]])} = ${n2s(c)} ${sg(-b)} = ${n2s(c - b)}`)}`, `Move ${ex(sg(b))} across (change sign): ${ex(`${poly([[a, 1]])} = ${n2s(c)} ${sg(-b)} = ${n2s(c - b)}`)}`),
        L(`หารด้วย ${neg(a)} ทั้งสองข้าง: ${ex(`x = ${n2s(c - b)} ÷ ${neg(a)} = ${n2s(x)}`)}`, `Divide both sides by ${neg(a)}: ${ex(`x = ${n2s(c - b)} ÷ ${neg(a)} = ${n2s(x)}`)}`)],
      mistakes, hint: L('ย้ายค่าคงที่ไปอีกข้างก่อน แล้วหารด้วยสัมประสิทธิ์ของ x', 'Move the constant first, then divide by the coefficient of x') };
  }
  const a = ri(2, 9), d = nz(-6, 9, [0, a]), b = nz(-15, 15), e = (a - d) * x + b;
  const mistakes = [{ tag: 'transpose-sign', value: (e - b) / (a + d), step: 0 }, { tag: 'transpose-sign', value: (e + b) / (a - d), step: 0 }];
  return { text: L(`จงแก้สมการ ${ex(`${poly([[a, 1], [b, 0]])} = ${poly([[d, 1], [e, 0]])}`)} หาค่า x`, `Solve ${ex(`${poly([[a, 1], [b, 0]])} = ${poly([[d, 1], [e, 0]])}`)} for x`), answer: x,
    steps: [L(`ย้ายพจน์ x มาซ้าย ค่าคงที่ไปขวา: ${ex(`${poly([[a, 1]])} ${d < 0 ? '+' : '−'} ${poly([[Math.abs(d), 1]])} = ${n2s(e)} ${sg(-b)}`)}`, `x-terms left, constants right: ${ex(`${poly([[a, 1]])} ${d < 0 ? '+' : '−'} ${poly([[Math.abs(d), 1]])} = ${n2s(e)} ${sg(-b)}`)}`),
      L(`รวมพจน์: ${ex(`${poly([[a - d, 1]])} = ${n2s(e - b)}`)}`, `Combine: ${ex(`${poly([[a - d, 1]])} = ${n2s(e - b)}`)}`), L(`${ex(`x = ${n2s(e - b)} ÷ ${neg(a - d)} = ${n2s(x)}`)}`)],
    mistakes, hint: L('รวมพจน์ที่มี x ไว้ข้างเดียวกัน (อย่าลืมเปลี่ยนเครื่องหมายเมื่อย้ายข้าง)', 'Collect x-terms on one side — change signs when moving terms') };
}});

def({ id: 'percent', subject: 'math', grades: [1, 2], name: L('ร้อยละ', 'Percentages'), gen(lv) {
  const P = ri(4, 40) * 50, r = pick([10, 15, 20, 25, 30, 40]);
  const suffix = L('บาท', 'baht');
  if (lv === 1) {
    const ans = P * (1 - r / 100);
    return { text: L(`เสื้อตัวหนึ่งราคา ${ex(P)} บาท ลดราคา ${ex(r + '%')} ราคาขายเป็นเท่าไร`, `A shirt costs ${ex(P)} baht and is ${ex(r + '%')} off. What is the sale price?`), suffix, answer: ans,
      steps: [L(`ส่วนลด = ${ex(`${P} × ${r}/100 = ${fmt(P * r / 100)}`)} บาท`, `Discount = ${ex(`${P} × ${r}/100 = ${fmt(P * r / 100)}`)} baht`), L(`ราคาขาย = ${ex(`${P} − ${fmt(P * r / 100)} = ${fmt(ans)}`)} บาท`, `Sale price = ${ex(`${P} − ${fmt(P * r / 100)} = ${fmt(ans)}`)} baht`)],
      mistakes: [{ tag: 'percent-final', value: P * r / 100, step: 1 }, { tag: 'percent-as-number', value: P - r, step: 0 }], hint: L('ส่วนลด = ราคา × r/100 แล้วนำไปลบออก', 'Discount = price × r/100, then subtract it') };
  }
  if (lv === 2) {
    const s = P * (1 - r / 100), ans = r2(s * 1.07);
    return { text: L(`สินค้าราคา ${ex(P)} บาท ลด ${ex(r + '%')} แล้วคิดภาษีมูลค่าเพิ่ม ${ex('7%')} จากราคาหลังลด ต้องจ่ายเท่าไร`, `An item costs ${ex(P)} baht, is ${ex(r + '%')} off, then 7% VAT is added on the discounted price. How much do you pay?`), suffix, answer: ans,
      steps: [L(`ราคาหลังลด = ${ex(`${P} × ${fmt(1 - r / 100)} = ${fmt(s)}`)}`, `After discount = ${ex(`${P} × ${fmt(1 - r / 100)} = ${fmt(s)}`)}`), L(`บวก VAT 7%: ${ex(`${fmt(s)} × 1.07`)}`, `Add 7% VAT: ${ex(`${fmt(s)} × 1.07`)}`), L(`${ex(`= ${fmt(ans, 2)}`)} บาท`, `${ex(`= ${fmt(ans, 2)}`)} baht`)],
      mistakes: [{ tag: 'percent-chain', value: r2(P * (1 - r / 100 + 0.07)), step: 1 }, { tag: 'percent-final', value: s, step: 1 }], hint: L('คิดทีละขั้น: ลดราคาก่อน แล้วคูณ 1.07', 'Step by step: discount first, then multiply by 1.07') };
  }
  const ans = r2(P * (1 + r / 100) * (1 - r / 100));
  return { text: L(`ร้านขึ้นราคาสินค้า ${ex(P)} บาท อีก ${ex(r + '%')} ต่อมาลดราคาลง ${ex(r + '%')} จากราคาใหม่ ราคาสุดท้ายเป็นเท่าไร`, `A ${ex(P)}-baht item is raised by ${ex(r + '%')}, then reduced by ${ex(r + '%')} of the new price. What is the final price?`), suffix, answer: ans,
    steps: [L(`ขึ้นราคา: ${ex(`${P} × ${fmt(1 + r / 100)} = ${fmt(P * (1 + r / 100))}`)}`, `Increase: ${ex(`${P} × ${fmt(1 + r / 100)} = ${fmt(P * (1 + r / 100))}`)}`), L(`ลดราคา: ${ex(`${fmt(P * (1 + r / 100))} × ${fmt(1 - r / 100)}`)}`, `Decrease: ${ex(`${fmt(P * (1 + r / 100))} × ${fmt(1 - r / 100)}`)}`), L(`${ex(`= ${fmt(ans, 2)}`)} บาท (ไม่เท่ากับราคาเดิม เพราะฐานต่างกัน)`, `${ex(`= ${fmt(ans, 2)}`)} baht (not the original — the bases differ)`)],
    mistakes: [{ tag: 'percent-chain', value: P, step: 2 }], hint: L('เปอร์เซ็นต์ที่สองคิดจากราคาใหม่', 'The second percentage uses the new price') };
}});

def({ id: 'expo', subject: 'math', grades: [1, 2, 3], name: L('เลขยกกำลัง', 'Exponents'), gen(lv) {
  const base = pick(['a', 'x', '2', '5']);
  const note = L('ตอบเฉพาะเลขชี้กำลัง', 'Enter the exponent only');
  if (lv === 1) {
    const m = ri(2, 9), n = nz(2, 9, [2]);
    return { text: L(`${ex(`${base}${sup(m)} × ${base}${sup(n)} = ${base}${sup('?')}`)}`), note, answer: m + n,
      steps: [L('ฐานเดียวกันคูณกัน ให้นำเลขชี้กำลังมาบวกกัน', 'Same base multiplied → add the exponents'), L(`${ex(`${m} + ${n} = ${m + n}`)} ดังนั้นได้ ${ex(`${base}${sup(m + n)}`)}`, `${ex(`${m} + ${n} = ${m + n}`)} so ${ex(`${base}${sup(m + n)}`)}`)],
      mistakes: [{ tag: 'exponent-rule', value: m * n, step: 0 }], hint: L('aᵐ × aⁿ = aᵐ⁺ⁿ') };
  }
  if (lv === 2) {
    const m = ri(2, 9), n = ri(2, 9), k = ri(2, 12);
    return { text: L(`${ex(`${base}${sup(m)} × ${base}${sup(n)} ÷ ${base}${sup(k)} = ${base}${sup('?')}`)}`), note, answer: m + n - k,
      steps: [L(`คูณ → บวกเลขชี้กำลัง: ${ex(`${m} + ${n} = ${m + n}`)}`, `Multiply → add: ${ex(`${m} + ${n} = ${m + n}`)}`), L(`หาร → ลบเลขชี้กำลัง: ${ex(`${m + n} − ${k} = ${n2s(m + n - k)}`)}`, `Divide → subtract: ${ex(`${m + n} − ${k} = ${n2s(m + n - k)}`)}`)],
      mistakes: [{ tag: 'exponent-rule', value: m + n + k, step: 1 }, { tag: 'exponent-rule', value: m * n - k, step: 0 }], hint: L('aᵐ ÷ aⁿ = aᵐ⁻ⁿ (เลขชี้กำลังติดลบได้)', 'aᵐ ÷ aⁿ = aᵐ⁻ⁿ (can be negative)') };
  }
  let m, n; do { m = ri(2, 5); n = ri(2, 5); } while (m * n === m + n);
  const k = ri(1, 8), j = ri(1, 9);
  return { text: L(`${ex(`(${base}${sup(m)})${sup(n)} × ${base}${sup(k)} ÷ ${base}${sup(j)} = ${base}${sup('?')}`)}`), note, answer: m * n + k - j,
    steps: [L(`ยกกำลังซ้อน → คูณเลขชี้กำลัง: ${ex(`${m} × ${n} = ${m * n}`)}`, `Power of a power → multiply: ${ex(`${m} × ${n} = ${m * n}`)}`), L(`คูณ → บวก: ${ex(`${m * n} + ${k} = ${m * n + k}`)}`, `Multiply → add: ${ex(`${m * n} + ${k} = ${m * n + k}`)}`), L(`หาร → ลบ: ${ex(`${m * n + k} − ${j} = ${n2s(m * n + k - j)}`)}`, `Divide → subtract: ${ex(`${m * n + k} − ${j} = ${n2s(m * n + k - j)}`)}`)],
    mistakes: [{ tag: 'power-of-power', value: m + n + k - j, step: 0 }, { tag: 'exponent-rule', value: m * n + k + j, step: 2 }], hint: L('(aᵐ)ⁿ = aᵐⁿ') };
}});

def({ id: 'pythag', subject: 'math', grades: [2], name: L('ทฤษฎีบทพีทาโกรัส', 'Pythagoras’ theorem'), gen(lv) {
  const T = pick([[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25], [20, 21, 29]]), k = lv === 1 ? ri(1, 3) : ri(1, 2);
  const unit = L('ซม.', 'cm');
  if (lv === 2) {
    const [a, b, c] = T.map(v => v * k);
    return { text: L(`สามเหลี่ยมมุมฉากมีด้านตรงข้ามมุมฉากยาว ${ex(c)} ซม. และด้านประกอบมุมฉากด้านหนึ่งยาว ${ex(a)} ซม. อีกด้านยาวเท่าไร`, `A right triangle has hypotenuse ${ex(c)} cm and one leg ${ex(a)} cm. Find the other leg.`), suffix: unit, answer: b,
      diagram: svgTriangle({ base: `${a}`, vert: '?', hyp: `${c}` }),
      steps: [L(`${ex(`b${sup(2)} = c${sup(2)} − a${sup(2)}`)}`), L(`${ex(`b${sup(2)} = ${c * c} − ${a * a} = ${b * b}`)}`), L(`${ex(`b = √${b * b} = ${b}`)} ซม.`, `${ex(`b = √${b * b} = ${b}`)} cm`)],
      mistakes: [{ tag: 'pythag-leg', value: r2(Math.sqrt(c * c + a * a)), step: 0 }, { tag: 'square-forgot', value: c - a, step: 0 }, { tag: 'sqrt-forgot', value: b * b, step: 2 }], hint: L('ด้านตรงข้ามมุมฉาก (c) ยาวที่สุดเสมอ', 'The hypotenuse (c) is always the longest side') };
  }
  let a, b, c;
  if (lv === 1) [a, b, c] = T.map(v => v * k); else { a = ri(3, 20); b = ri(3, 20); c = r2(Math.sqrt(a * a + b * b)); }
  return { text: L(`สามเหลี่ยมมุมฉากมีด้านประกอบมุมฉากยาว ${ex(a)} และ ${ex(b)} ซม. ด้านตรงข้ามมุมฉากยาวเท่าไร${lv === 3 ? ' (ทศนิยม 2 ตำแหน่ง)' : ''}`, `A right triangle has legs ${ex(a)} cm and ${ex(b)} cm. Find the hypotenuse${lv === 3 ? ' (2 d.p.)' : ''}.`), suffix: unit, answer: c,
    diagram: svgTriangle({ base: `${a}`, vert: `${b}`, hyp: 'c = ?' }),
    steps: [L(`${ex(`c${sup(2)} = a${sup(2)} + b${sup(2)}`)}`), L(`${ex(`c${sup(2)} = ${a * a} + ${b * b} = ${a * a + b * b}`)}`), L(`${ex(`c = √${a * a + b * b} = ${fmt(c, 2)}`)}`)],
    mistakes: [{ tag: 'square-forgot', value: a + b, step: 0 }, { tag: 'sqrt-forgot', value: a * a + b * b, step: 2 }], hint: L('c² = a² + b² แล้วอย่าลืมถอดราก', 'c² = a² + b², then take the square root') };
}});

def({ id: 'system', subject: 'math', grades: [3], name: L('ระบบสมการสองตัวแปร', 'Simultaneous equations'), gen(lv) {
  let x, y, a1, b1, a2, b2;
  do {
    x = ri(-8, 8); y = ri(-8, 8);
    if (lv === 1) { a1 = 1; b1 = 1; a2 = 1; b2 = -1; }
    else if (lv === 2) { a1 = 1; b1 = nz(-5, 5); a2 = nz(-5, 5); b2 = nz(-5, 5); }
    else { a1 = nz(-6, 6); b1 = nz(-6, 6); a2 = nz(-6, 6); b2 = nz(-6, 6); }
  } while (a1 * b2 - a2 * b1 === 0 || x === y || x === -x);
  const c1 = a1 * x + b1 * y, c2 = a2 * x + b2 * y;
  const eq = (a, b, c) => `${poly([[a, 1]], 'x')}${b < 0 ? ' − ' : ' + '}${poly([[Math.abs(b), 1]], 'y')} = ${n2s(c)}`;
  const D = a1 * b2 - a2 * b1;
  return { text: L(`จงหาค่า ${ex('x')} จากระบบสมการ<br><span class="eqs">${ex(eq(a1, b1, c1))}${ex(eq(a2, b2, c2))}</span>`, `Find ${ex('x')} from the system<br><span class="eqs">${ex(eq(a1, b1, c1))}${ex(eq(a2, b2, c2))}</span>`), answer: x,
    steps: [L(`กำจัด y: คูณสมการแรกด้วย ${neg(b2)} และสมการที่สองด้วย ${neg(b1)} แล้วลบกัน`, `Eliminate y: multiply eq.1 by ${neg(b2)}, eq.2 by ${neg(b1)}, then subtract`),
      L(`${ex(`(${a1 * b2} − ${neg(a2 * b1)})x = ${n2s(c1 * b2)} − ${neg(c2 * b1)}`)} → ${ex(`${n2s(D)}x = ${n2s(c1 * b2 - c2 * b1)}`)}`),
      L(`${ex(`x = ${n2s(c1 * b2 - c2 * b1)} ÷ ${neg(D)} = ${n2s(x)}`)} (และ y = ${n2s(y)})`, `${ex(`x = ${n2s(c1 * b2 - c2 * b1)} ÷ ${neg(D)} = ${n2s(x)}`)} (and y = ${n2s(y)})`)],
    mistakes: [{ tag: 'var-swap', value: y, step: 2 }, { tag: 'sign', value: -x, step: 1 }], hint: L('ทำสัมประสิทธิ์ของ y ให้เท่ากันแล้วลบสมการ', 'Match the y coefficients, then subtract the equations') };
}});

def({ id: 'quad', subject: 'math', grades: [3, 4], name: L('สมการกำลังสอง', 'Quadratic equations'), gen(lv) {
  if (lv < 3) {
    let r1, r2; do { r1 = nz(-9, 9); r2 = nz(-9, 9); } while (r1 === r2 || r1 === -r2);
    const a = lv === 1 ? 1 : ri(2, 3), b = -a * (r1 + r2), c = a * r1 * r2, R = Math.max(r1, r2), m = Math.min(r1, r2);
    const fac = `(x ${sg(-r1)})(x ${sg(-r2)})`;
    return { text: L(`จงหารากที่มีค่ามากกว่าของสมการ ${ex(`${poly([[a, 2], [b, 1], [c, 0]])} = 0`)}`, `Find the larger root of ${ex(`${poly([[a, 2], [b, 1], [c, 0]])} = 0`)}`), answer: R,
      steps: [...(a > 1 ? [L(`หารตลอดด้วย ${a}: ${ex(`${poly([[1, 2], [b / a, 1], [c / a, 0]])} = 0`)}`, `Divide through by ${a}: ${ex(`${poly([[1, 2], [b / a, 1], [c / a, 0]])} = 0`)}`)] : []),
        L(`หาจำนวนสองจำนวนที่คูณกันได้ ${n2s(c / a)} และบวกกันได้ ${n2s(b / a)}: คือ ${n2s(-r1)} และ ${n2s(-r2)}`, `Two numbers with product ${n2s(c / a)} and sum ${n2s(b / a)}: ${n2s(-r1)} and ${n2s(-r2)}`),
        L(`แยกตัวประกอบ: ${ex(`${fac} = 0`)} → ${ex(`x = ${n2s(r1)}`)} หรือ ${ex(`x = ${n2s(r2)}`)}`, `Factor: ${ex(`${fac} = 0`)} → ${ex(`x = ${n2s(r1)}`)} or ${ex(`x = ${n2s(r2)}`)}`),
        L(`รากที่มากกว่าคือ ${ex(n2s(R))}`, `The larger root is ${ex(n2s(R))}`)],
      mistakes: [{ tag: 'factor-sign', value: -m, step: a > 1 ? 2 : 1 }, { tag: 'root-choice', value: m, step: a > 1 ? 3 : 2 }], hint: L('แยกตัวประกอบ แล้วจับแต่ละวงเล็บเท่ากับ 0', 'Factor, then set each bracket to 0') };
  }
  let a, b, c, D;
  do { a = ri(1, 3); b = ri(-9, 9); c = nz(-9, 9); D = b * b - 4 * a * c; } while (D <= 0 || Number.isInteger(Math.sqrt(D)));
  const R = r2((-b + Math.sqrt(D)) / (2 * a)), sq = r2(Math.sqrt(D), 3);
  const mistakes = [{ tag: 'sign', value: r2((b + Math.sqrt(D)) / (2 * a)), step: 2 }];
  if (a > 1) mistakes.push({ tag: 'formula-2a', value: r2((-b + Math.sqrt(D)) / 2), step: 2 });
  if (b * b + 4 * a * c > 0) mistakes.push({ tag: 'discriminant', value: r2((-b + Math.sqrt(b * b + 4 * a * c)) / (2 * a)), step: 0 });
  return { text: L(`จงหารากที่มีค่ามากกว่าของ ${ex(`${poly([[a, 2], [b, 1], [c, 0]])} = 0`)} (ทศนิยม 2 ตำแหน่ง)`, `Find the larger root of ${ex(`${poly([[a, 2], [b, 1], [c, 0]])} = 0`)} (2 d.p.)`), answer: R,
    steps: [L(`${ex(`D = b${sup(2)} − 4ac = ${neg(b)}${sup(2)} − 4(${a})(${n2s(c)}) = ${D}`)}`), L(`${ex(`x = (−b ± √D) / 2a = (${n2s(-b)} ± ${sq}) / ${2 * a}`)}`), L(`รากที่มากกว่า: ${ex(`(${n2s(-b)} + ${sq}) / ${2 * a} ≈ ${fmt(R, 2)}`)}`, `Larger root: ${ex(`(${n2s(-b)} + ${sq}) / ${2 * a} ≈ ${fmt(R, 2)}`)}`)],
    mistakes, hint: L('ใช้สูตร x = (−b ± √(b² − 4ac)) / 2a', 'Use x = (−b ± √(b² − 4ac)) / 2a') };
}});

def({ id: 'trig', subject: 'math', grades: [4], name: L('อัตราส่วนตรีโกณมิติ', 'Trigonometric ratios'), gen(lv) {
  const rad = d => d * Math.PI / 180, unit = L('ซม.', 'cm');
  if (lv < 3) {
    const th = lv === 1 ? 30 : ri(20, 70), h = lv === 1 ? ri(2, 15) * 2 : ri(5, 30), ans = r2(h * Math.sin(rad(th)));
    return { text: L(`สามเหลี่ยมมุมฉากมีด้านตรงข้ามมุมฉากยาว ${ex(h)} ซม. และมุม ${ex(`θ = ${th}°`)} จงหาความยาวด้านตรงข้ามมุม θ${lv === 2 ? ' (ทศนิยม 2 ตำแหน่ง)' : ''}`, `A right triangle has hypotenuse ${ex(h)} cm and angle ${ex(`θ = ${th}°`)}. Find the side opposite θ${lv === 2 ? ' (2 d.p.)' : ''}.`), suffix: unit, answer: ans,
      diagram: svgTriangle({ base: '', vert: '?', hyp: `${h}`, angle: `${th}°` }),
      steps: [L(`${ex('sin θ = ข้าม / ฉาก')} → ${ex('ข้าม = ฉาก × sin θ')}`, `${ex('sin θ = opp / hyp')} → ${ex('opp = hyp × sin θ')}`), L(`${ex(`= ${h} × sin ${th}° = ${h} × ${fmt(Math.sin(rad(th)), 4)}`)}`), L(`${ex(`≈ ${fmt(ans, 2)}`)} ซม.`, `${ex(`≈ ${fmt(ans, 2)}`)} cm`)],
      mistakes: [{ tag: 'trig-ratio', value: r2(h * Math.cos(rad(th))), step: 0 }, { tag: 'trig-ratio', value: r2(h * Math.tan(rad(th))), step: 0 }, { tag: 'trig-inverse', value: r2(h / Math.sin(rad(th))), step: 0 }], hint: L('ด้านตรงข้ามกับด้านตรงข้ามมุมฉาก → ใช้ sin', 'Opposite & hypotenuse → use sin') };
  }
  const th = ri(20, 70), adj = ri(5, 30), ans = r2(adj * Math.tan(rad(th)));
  return { text: L(`บันไดพาดกำแพง ฐานบันไดห่างกำแพง ${ex(adj)} ซม. ทำมุม ${ex(`${th}°`)} กับพื้น จุดที่บันไดแตะกำแพงสูงเท่าไร (ทศนิยม 2 ตำแหน่ง)`, `A ladder's foot is ${ex(adj)} cm from a wall and makes ${ex(`${th}°`)} with the ground. How high up the wall does it reach? (2 d.p.)`), suffix: unit, answer: ans,
    diagram: svgTriangle({ base: `${adj}`, vert: '?', hyp: '', angle: `${th}°` }),
    steps: [L(`รู้ด้านชิด หาด้านข้าม → ${ex('tan θ = ข้าม / ชิด')}`, `Know adjacent, want opposite → ${ex('tan θ = opp / adj')}`), L(`${ex(`ข้าม = ${adj} × tan ${th}° = ${adj} × ${fmt(Math.tan(rad(th)), 4)}`)}`, `${ex(`opp = ${adj} × tan ${th}° = ${adj} × ${fmt(Math.tan(rad(th)), 4)}`)}`), L(`${ex(`≈ ${fmt(ans, 2)}`)}`)],
    mistakes: [{ tag: 'trig-ratio', value: r2(adj * Math.sin(rad(th))), step: 0 }, { tag: 'trig-inverse', value: r2(adj / Math.tan(rad(th))), step: 1 }, { tag: 'trig-ratio', value: r2(adj / Math.cos(rad(th))), step: 0 }], hint: L('ด้านข้ามกับด้านชิด → ใช้ tan', 'Opposite & adjacent → use tan') };
}});

def({ id: 'seq', subject: 'math', grades: [5], name: L('ลำดับและอนุกรม', 'Sequences & series'), gen(lv) {
  if (lv === 1) {
    const a = ri(-10, 20), d = nz(-6, 9), n = ri(8, 30), ans = a + (n - 1) * d;
    const terms = [0, 1, 2, 3].map(i => n2s(a + i * d)).join(', ');
    return { text: L(`ลำดับเลขคณิต ${ex(`${terms}, …`)} พจน์ที่ ${ex(n)} คือเท่าไร`, `Arithmetic sequence ${ex(`${terms}, …`)}. Find term ${ex(n)}.`), answer: ans,
      steps: [L(`${ex(`a₁ = ${n2s(a)}, d = ${n2s(d)}`)}`), L(`${ex(`aₙ = a₁ + (n − 1)d = ${n2s(a)} + (${n} − 1)(${n2s(d)})`)}`), L(`${ex(`= ${n2s(ans)}`)}`)],
      mistakes: [{ tag: 'seq-index', value: a + n * d, step: 1 }], hint: L('aₙ = a₁ + (n − 1)d') };
  }
  if (lv === 2) {
    const a = ri(-10, 20), d = nz(-5, 8), n = ri(10, 40), ans = n * (2 * a + (n - 1) * d) / 2;
    return { text: L(`ผลบวก ${ex(n)} พจน์แรกของอนุกรมเลขคณิตที่มี ${ex(`a₁ = ${n2s(a)}`)} และ ${ex(`d = ${n2s(d)}`)} เท่ากับเท่าไร`, `Find the sum of the first ${ex(n)} terms of an arithmetic series with ${ex(`a₁ = ${n2s(a)}`)}, ${ex(`d = ${n2s(d)}`)}.`), answer: ans,
      steps: [L(`${ex(`Sₙ = n/2 · [2a₁ + (n − 1)d]`)}`), L(`${ex(`= ${n}/2 · [2(${n2s(a)}) + ${n - 1}(${n2s(d)})] = ${n}/2 · ${n2s(2 * a + (n - 1) * d)}`)}`), L(`${ex(`= ${n2s(ans)}`)}`)],
      mistakes: [{ tag: 'half-forgot', value: ans * 2, step: 0 }, { tag: 'seq-index', value: n * (2 * a + n * d) / 2, step: 1 }], hint: L('Sₙ = n/2 · [2a₁ + (n − 1)d]') };
  }
  const a = ri(1, 5), r = pick([2, 3, -2]), n = ri(4, 8), ans = a * r ** (n - 1);
  const terms = [0, 1, 2].map(i => n2s(a * r ** i)).join(', ');
  return { text: L(`ลำดับเรขาคณิต ${ex(`${terms}, …`)} พจน์ที่ ${ex(n)} คือเท่าไร`, `Geometric sequence ${ex(`${terms}, …`)}. Find term ${ex(n)}.`), answer: ans,
    steps: [L(`${ex(`a₁ = ${a}, r = ${n2s(r)}`)}`), L(`${ex(`aₙ = a₁ · r${sup('n−1')} = ${a} · ${neg(r)}${sup(n - 1)}`)}`), L(`${ex(`= ${n2s(ans)}`)}`)],
    mistakes: [{ tag: 'seq-index', value: a * r ** n, step: 1 }, { tag: 'exponent-order', value: (a * r) ** (n - 1), step: 1 }], hint: L('aₙ = a₁ · rⁿ⁻¹') };
}});

def({ id: 'prob', subject: 'math', grades: [5], name: L('ความน่าจะเป็น', 'Probability'), gen(lv) {
  const note = L('ตอบเป็นเศษส่วน (เช่น 3/8) หรือทศนิยม 3 ตำแหน่ง', 'Answer as a fraction (e.g. 3/8) or 3 d.p.');
  if (lv === 1) {
    const r = ri(2, 9), b = ri(2, 9);
    return { text: L(`ถุงใบหนึ่งมีลูกบอลสีแดง ${ex(r)} ลูก และสีน้ำเงิน ${ex(b)} ลูก สุ่มหยิบ 1 ลูก ความน่าจะเป็นที่ได้สีแดงเท่าไร`, `A bag has ${ex(r)} red and ${ex(b)} blue balls. One is drawn at random. P(red)?`), note, tol: 0.0006, answer: r / (r + b), answerText: fracStr(r, r + b),
      steps: [L(`ผลลัพธ์ทั้งหมด = ${ex(`${r} + ${b} = ${r + b}`)}`, `All outcomes = ${ex(`${r} + ${b} = ${r + b}`)}`), L(`${ex(`P(แดง) = ${r}/${r + b} = ${fracStr(r, r + b)}`)}`, `${ex(`P(red) = ${r}/${r + b} = ${fracStr(r, r + b)}`)}`)],
      mistakes: [{ tag: 'prob-total', value: r / b, step: 0 }], hint: L('ตัวส่วนคือจำนวนลูกบอลทั้งหมด', 'The denominator is the total number of balls') };
  }
  if (lv === 2) {
    const s = nz(2, 12, [7]), cnt = 6 - Math.abs(s - 7);
    return { text: L(`ทอยลูกเต๋า 2 ลูกพร้อมกัน ความน่าจะเป็นที่ผลรวมแต้มเท่ากับ ${ex(s)} เท่าไร`, `Two dice are rolled. What is P(sum = ${ex(s)})?`), note, tol: 0.0006, answer: cnt / 36, answerText: fracStr(cnt, 36),
      steps: [L(`ผลลัพธ์ทั้งหมด ${ex('6 × 6 = 36')} แบบ (มีโอกาสเท่ากัน)`, `${ex('6 × 6 = 36')} equally likely outcomes`), L(`คู่ที่รวมได้ ${s}: มี ${cnt} แบบ`, `Pairs summing to ${s}: ${cnt}`), L(`${ex(`P = ${cnt}/36 = ${fracStr(cnt, 36)}`)}`)],
      mistakes: [{ tag: 'sample-space', value: 1 / 11, step: 0 }, { tag: 'prob-total', value: cnt / 12, step: 0 }], hint: L('เขียนตาราง 6×6 แล้วนับ', 'Draw a 6×6 table and count') };
  }
  const r = ri(3, 8), b = ri(2, 8), n = r + b;
  return { text: L(`ถุงมีลูกแก้วแดง ${ex(r)} ลูก เขียว ${ex(b)} ลูก หยิบ 2 ลูกทีละลูกโดย<b>ไม่ใส่คืน</b> ความน่าจะเป็นที่ได้แดงทั้งสองลูกเท่าไร`, `A bag has ${ex(r)} red and ${ex(b)} green marbles. Two are drawn <b>without replacement</b>. P(both red)?`), note, tol: 0.0006, answer: r * (r - 1) / (n * (n - 1)), answerText: fracStr(r * (r - 1), n * (n - 1)),
    steps: [L(`ลูกแรกแดง: ${ex(`${r}/${n}`)}`, `First red: ${ex(`${r}/${n}`)}`), L(`ลูกที่สองแดง (เหลือแดง ${r - 1} จาก ${n - 1}): ${ex(`${r - 1}/${n - 1}`)}`, `Second red (${r - 1} of ${n - 1} left): ${ex(`${r - 1}/${n - 1}`)}`), L(`${ex(`P = ${r}/${n} × ${r - 1}/${n - 1} = ${fracStr(r * (r - 1), n * (n - 1))}`)}`)],
    mistakes: [{ tag: 'replacement', value: (r / n) ** 2, step: 1 }], hint: L('หยิบลูกที่สอง จำนวนทั้งหมดลดลง 1', 'After the first draw, one fewer marble remains') };
}});

def({ id: 'deriv', subject: 'math', grades: [6], name: L('อนุพันธ์ของพหุนาม', 'Derivatives of polynomials'), gen(lv) {
  const k = nz(-3, 3);
  let cs; // [[coef, pow]]
  if (lv === 1) cs = [[nz(-5, 5), 2], [nz(-9, 9), 1], [ri(-9, 9), 0]];
  else if (lv === 2) cs = [[nz(-4, 4), 3], [nz(-6, 6), 2], [nz(-9, 9), 1], [ri(-9, 9), 0]];
  else cs = [[nz(-3, 3), 4], [nz(-5, 5), 3], [nz(-9, 9), 1], [ri(-9, 9), 0]];
  const d = cs.filter(([, p]) => p > 0).map(([c, p]) => [c * p, p - 1]);
  const ev = arr => arr.reduce((s, [c, p]) => s + c * k ** p, 0);
  const ans = ev(d);
  return { text: L(`กำหนด ${ex(`f(x) = ${poly(cs)}`)} จงหา ${ex(`f′(${n2s(k)})`)}`, `Given ${ex(`f(x) = ${poly(cs)}`)}, find ${ex(`f′(${n2s(k)})`)}`), answer: ans,
    steps: [L(`ใช้ ${ex(`d/dx(ax${sup('n')}) = n·a·x${sup('n−1')}`)} ทีละพจน์`, `Apply ${ex(`d/dx(ax${sup('n')}) = n·a·x${sup('n−1')}`)} term by term`), L(`${ex(`f′(x) = ${poly(d)}`)}`), L(`แทน x = ${n2s(k)}: ${ex(`f′(${n2s(k)}) = ${n2s(ans)}`)}`, `Substitute x = ${n2s(k)}: ${ex(`f′(${n2s(k)}) = ${n2s(ans)}`)}`)],
    mistakes: [{ tag: 'derivative-eval', value: ev(cs), step: 2 }, { tag: 'derivative-power', value: ev(cs.filter(([, p]) => p > 0).map(([c, p]) => [c, p - 1])), step: 0 }, { tag: 'derivative-exponent', value: ev(cs.filter(([, p]) => p > 0).map(([c, p]) => [c * p, p])), step: 0 }],
    hint: L('ดิฟก่อน แล้วค่อยแทนค่า', 'Differentiate first, then substitute') };
}});

def({ id: 'kin', subject: 'physics', grades: [4], name: L('การเคลื่อนที่แนวตรง', 'Linear motion'), gen(lv) {
  if (lv === 1) {
    const u = ri(0, 10), a = ri(1, 5), t = ri(2, 10), s = u * t + 0.5 * a * t * t;
    return { text: L(`รถเริ่มต้นด้วยความเร็ว ${ex(`${u} m/s`)} เร่งด้วยความเร่งคงที่ ${ex(`${a} m/s²`)} เป็นเวลา ${ex(`${t} s`)} รถเคลื่อนที่ได้ระยะทางเท่าไร`, `A car starts at ${ex(`${u} m/s`)} and accelerates at ${ex(`${a} m/s²`)} for ${ex(`${t} s`)}. How far does it travel?`), answer: s, unit: 'm', unitOpts: ['m', 'm/s', 'm/s²', 's'],
      steps: [L(`${ex('s = ut + ½at²')}`), L(`${ex(`s = (${u})(${t}) + ½(${a})(${t})² = ${u * t} + ${fmt(0.5 * a * t * t)}`)}`), L(`${ex(`s = ${fmt(s)} m`)}`)],
      mistakes: [{ tag: 'half-forgot', value: u * t + a * t * t, step: 0 }, { tag: 'formula', value: u * t, step: 0 }], hint: L('s = ut + ½at²') };
  }
  if (lv === 2) {
    const uk = pick([36, 54, 72, 90, 108]), a = ri(1, 4), t = ri(2, 8), v = uk / 3.6 + a * t;
    return { text: L(`รถวิ่งด้วยความเร็ว ${ex(`${uk} km/h`)} แล้วเร่งด้วย ${ex(`${a} m/s²`)} นาน ${ex(`${t} s`)} ความเร็วสุดท้ายเป็นเท่าไรในหน่วย m/s`, `A car at ${ex(`${uk} km/h`)} accelerates at ${ex(`${a} m/s²`)} for ${ex(`${t} s`)}. Final speed in m/s?`), answer: v, unit: 'm/s', unitOpts: ['m/s', 'km/h', 'm/s²', 'm'],
      steps: [L(`แปลงหน่วย: ${ex(`${uk} km/h ÷ 3.6 = ${fmt(uk / 3.6)} m/s`)}`, `Convert: ${ex(`${uk} km/h ÷ 3.6 = ${fmt(uk / 3.6)} m/s`)}`), L(`${ex(`v = u + at = ${fmt(uk / 3.6)} + (${a})(${t})`)}`), L(`${ex(`v = ${fmt(v)} m/s`)}`)],
      mistakes: [{ tag: 'unit-convert', value: uk + a * t, step: 0 }, { tag: 'formula', value: uk / 3.6 + a, step: 1 }], hint: L('แปลง km/h เป็น m/s ก่อน (÷ 3.6)', 'Convert km/h to m/s first (÷ 3.6)') };
  }
  const uk = pick([36, 54, 72, 90, 108]), a = ri(2, 8), u = uk / 3.6, s = r2(u * u / (2 * a));
  return { text: L(`รถวิ่งด้วยความเร็ว ${ex(`${uk} km/h`)} เบรกด้วยความหน่วง ${ex(`${a} m/s²`)} จนหยุด ระยะเบรกเป็นเท่าไร (ทศนิยม 2 ตำแหน่ง)`, `A car at ${ex(`${uk} km/h`)} brakes at ${ex(`${a} m/s²`)} until it stops. Braking distance? (2 d.p.)`), answer: s, unit: 'm', unitOpts: ['m', 'm/s', 's', 'km'],
    steps: [L(`${ex(`u = ${uk} ÷ 3.6 = ${fmt(u)} m/s`)}, ${ex('v = 0')}`), L(`${ex('v² = u² − 2as')} → ${ex('s = u² / 2a')}`), L(`${ex(`s = ${fmt(u)}² / (2 × ${a}) ≈ ${fmt(s, 2)} m`)}`)],
    mistakes: [{ tag: 'unit-convert', value: r2(uk * uk / (2 * a)), step: 0 }, { tag: 'half-forgot', value: r2(u * u / a), step: 1 }, { tag: 'square-forgot', value: r2(u / (2 * a)), step: 1 }], hint: L('ใช้ v² = u² + 2as โดยความเร่งเป็นลบ', 'Use v² = u² + 2as with negative acceleration') };
}});

def({ id: 'newton', subject: 'physics', grades: [4], name: L('กฎการเคลื่อนที่ของนิวตัน', 'Newton’s laws'), gen(lv) {
  if (lv === 1) {
    const F = ri(10, 100), m = ri(2, 20), a = r2(F / m);
    return { text: L(`ออกแรง ${ex(`${F} N`)} ดึงวัตถุมวล ${ex(`${m} kg`)} บนพื้นลื่น วัตถุมีความเร่งเท่าไร (ทศนิยม 2 ตำแหน่ง)`, `A ${ex(`${F} N`)} force pulls a ${ex(`${m} kg`)} mass on a frictionless floor. Acceleration? (2 d.p.)`), answer: a, unit: 'm/s²', unitOpts: ['m/s²', 'N', 'm/s', 'kg'],
      steps: [L(`${ex('ΣF = ma')} → ${ex('a = F / m')}`), L(`${ex(`a = ${F} / ${m} ≈ ${fmt(a, 2)} m/s²`)}`)],
      mistakes: [{ tag: 'formula-swap', value: F * m, step: 0 }, { tag: 'formula-swap', value: r2(m / F, 3), step: 0 }], hint: L('a = F / m') };
  }
  if (lv === 2) {
    const m = ri(2, 15), F = ri(30, 120), f = ri(5, F - 10), a = r2((F - f) / m);
    return { text: L(`ดึงกล่องมวล ${ex(`${m} kg`)} ด้วยแรง ${ex(`${F} N`)} มีแรงเสียดทาน ${ex(`${f} N`)} ต้านการเคลื่อนที่ กล่องมีความเร่งเท่าไร (ทศนิยม 2 ตำแหน่ง)`, `A ${ex(`${m} kg`)} box is pulled with ${ex(`${F} N`)} against ${ex(`${f} N`)} of friction. Acceleration? (2 d.p.)`), answer: a, unit: 'm/s²', unitOpts: ['m/s²', 'N', 'm/s', 'kg'],
      steps: [L(`แรงลัพธ์ ${ex(`ΣF = ${F} − ${f} = ${F - f} N`)}`, `Net force ${ex(`ΣF = ${F} − ${f} = ${F - f} N`)}`), L(`${ex(`a = ΣF / m = ${F - f} / ${m} ≈ ${fmt(a, 2)} m/s²`)}`)],
      mistakes: [{ tag: 'net-force', value: r2(F / m), step: 0 }, { tag: 'vector-direction', value: r2((F + f) / m), step: 0 }], hint: L('หาแรงลัพธ์ก่อน (แรงดึง − แรงเสียดทาน)', 'Find the net force first (pull − friction)') };
  }
  const m1 = ri(2, 10), m2 = ri(2, 10), F = ri(20, 100), a = F / (m1 + m2), T = r2(m2 * a);
  return { text: L(`กล่อง A มวล ${ex(`${m1} kg`)} ผูกเชือกกับกล่อง B มวล ${ex(`${m2} kg`)} ที่อยู่ด้านหลัง ออกแรง ${ex(`${F} N`)} ดึงกล่อง A บนพื้นลื่น แรงตึงเชือกระหว่างกล่องเป็นเท่าไร (ทศนิยม 2 ตำแหน่ง)`, `Box A (${ex(`${m1} kg`)}) is tied to box B (${ex(`${m2} kg`)}) behind it. A ${ex(`${F} N`)} force pulls A on a frictionless floor. Rope tension? (2 d.p.)`), answer: T, unit: 'N', unitOpts: ['N', 'm/s²', 'kg', 'J'],
    steps: [L(`ทั้งระบบ: ${ex(`a = F / (m₁ + m₂) = ${F} / ${m1 + m2} ≈ ${fmt(a, 3)} m/s²`)}`, `Whole system: ${ex(`a = F / (m₁ + m₂) = ${F} / ${m1 + m2} ≈ ${fmt(a, 3)} m/s²`)}`), L(`พิจารณากล่อง B: แรงเดียวคือแรงตึง ${ex(`T = m₂a = ${m2} × ${fmt(a, 3)}`)}`, `Consider B alone: only tension acts, ${ex(`T = m₂a = ${m2} × ${fmt(a, 3)}`)}`), L(`${ex(`T ≈ ${fmt(T, 2)} N`)}`)],
    mistakes: [{ tag: 'net-force', value: F, step: 1 }, { tag: 'tension-block', value: r2(m1 * a), step: 1 }], hint: L('หาความเร่งของทั้งระบบก่อน แล้วพิจารณากล่องหลังกล่องเดียว', 'Find the system acceleration, then isolate the rear box') };
}});

def({ id: 'proj', subject: 'physics', grades: [4], name: L('การเคลื่อนที่แบบโพรเจกไทล์', 'Projectile motion'), gen(lv) {
  const gNote = L(`ใช้ g = ${G_} m/s² ไม่คิดแรงต้านอากาศ`, `Use g = ${G_} m/s², ignore air resistance`);
  if (lv < 3) {
    const t = ri(1, 6), h = 5 * t * t, u = ri(5, 25);
    if (lv === 1) return { text: L(`ลูกบอลกลิ้งตกจากหน้าผาสูง ${ex(`${h} m`)} ในแนวราบ ใช้เวลาเท่าไรจึงถึงพื้น`, `A ball rolls horizontally off a ${ex(`${h} m`)} cliff. How long until it lands?`), note: gNote, answer: t, unit: 's', unitOpts: ['s', 'm', 'm/s', 'm/s²'],
      diagram: svgCliff({ h: `${h} m` }),
      steps: [L(`แนวดิ่งเริ่มจากความเร็ว 0: ${ex('h = ½gt²')}`, `Vertical motion starts from rest: ${ex('h = ½gt²')}`), L(`${ex(`t = √(2h/g) = √(2 × ${h} / ${G_})`)}`), L(`${ex(`t = ${t} s`)}`)],
      mistakes: [{ tag: 'half-forgot', value: r2(Math.sqrt(h / G_)), step: 1 }, { tag: 'sqrt-forgot', value: 2 * h / G_, step: 2 }], hint: L('h = ½gt² (แนวดิ่งไม่ขึ้นกับความเร็วแนวราบ)', 'h = ½gt² — vertical motion is independent of horizontal speed') };
    return { text: L(`ขว้างวัตถุในแนวราบด้วยความเร็ว ${ex(`${u} m/s`)} จากหน้าผาสูง ${ex(`${h} m`)} วัตถุตกห่างจากฐานหน้าผาเท่าไร`, `An object is thrown horizontally at ${ex(`${u} m/s`)} from a ${ex(`${h} m`)} cliff. How far from the base does it land?`), note: gNote, answer: u * t, unit: 'm', unitOpts: ['m', 's', 'm/s', 'm/s²'],
      diagram: svgCliff({ h: `${h} m`, u: `${u} m/s`, R: '?' }),
      steps: [L(`เวลาตก: ${ex(`t = √(2h/g) = √(2 × ${h} / ${G_}) = ${t} s`)}`, `Fall time: ${ex(`t = √(2h/g) = √(2 × ${h} / ${G_}) = ${t} s`)}`), L(`แนวราบความเร็วคงที่: ${ex(`R = u · t = ${u} × ${t}`)}`, `Horizontal speed is constant: ${ex(`R = u · t = ${u} × ${t}`)}`), L(`${ex(`R = ${u * t} m`)}`)],
      mistakes: [{ tag: 'half-forgot', value: r2(u * Math.sqrt(h / G_)), step: 0 }, { tag: 'sqrt-forgot', value: u * 2 * h / G_, step: 0 }], hint: L('หาเวลาจากแนวดิ่งก่อน แล้วคูณความเร็วแนวราบ', 'Get time from the vertical motion, then multiply by horizontal speed') };
  }
  const th = pick([15, 30, 37, 45, 53, 60, 75]), u = ri(10, 40), rad = th * Math.PI / 180, R = r2(u * u * Math.sin(2 * rad) / G_);
  return { text: L(`ยิงลูกบอลจากพื้นด้วยความเร็ว ${ex(`${u} m/s`)} ทำมุม ${ex(`${th}°`)} กับแนวราบ ลูกบอลตกห่างจากจุดยิงเท่าไร (ทศนิยม 2 ตำแหน่ง)`, `A ball is launched at ${ex(`${u} m/s`)}, ${ex(`${th}°`)} above horizontal. Horizontal range? (2 d.p.)`), note: gNote, answer: R, unit: 'm', unitOpts: ['m', 's', 'm/s', 'J'],
    diagram: svgAngleShot({ u: `${u} m/s`, angle: `${th}°`, R: 'R = ?' }),
    steps: [L(`${ex('R = u² sin 2θ / g')}`), L(`${ex(`R = ${u}² × sin ${2 * th}° / ${G_} = ${u * u} × ${fmt(Math.sin(2 * rad), 4)} / ${G_}`)}`), L(`${ex(`R ≈ ${fmt(R, 2)} m`)}`)],
    mistakes: [{ tag: 'double-angle', value: r2(u * u * Math.sin(rad) / G_), step: 0 }, { tag: 'square-forgot', value: r2(u * Math.sin(2 * rad) / G_), step: 0 }], hint: L('R = u² sin 2θ / g') };
}});

def({ id: 'energy', subject: 'physics', grades: [4], name: L('งานและพลังงาน', 'Work & energy'), gen(lv) {
  const gNote = L(`ใช้ g = ${G_} m/s²`, `Use g = ${G_} m/s²`);
  if (lv === 1) {
    const m = ri(1, 20), h = ri(2, 30), E = m * G_ * h;
    return { text: L(`วัตถุมวล ${ex(`${m} kg`)} อยู่สูงจากพื้น ${ex(`${h} m`)} มีพลังงานศักย์โน้มถ่วงเท่าไร`, `A ${ex(`${m} kg`)} object is ${ex(`${h} m`)} above the ground. Gravitational potential energy?`), note: gNote, answer: E, unit: 'J', unitOpts: ['J', 'N', 'W', 'kg'],
      steps: [L(`${ex('Eₚ = mgh')}`), L(`${ex(`Eₚ = ${m} × ${G_} × ${h} = ${E} J`)}`)],
      mistakes: [{ tag: 'gravity-forgot', value: m * h, step: 0 }, { tag: 'half-forgot', value: E / 2, step: 0 }], hint: L('Eₚ = mgh') };
  }
  if (lv === 2) {
    const m = ri(1, 12), v = ri(2, 20), E = 0.5 * m * v * v;
    return { text: L(`วัตถุมวล ${ex(`${m} kg`)} เคลื่อนที่ด้วยความเร็ว ${ex(`${v} m/s`)} มีพลังงานจลน์เท่าไร`, `A ${ex(`${m} kg`)} object moves at ${ex(`${v} m/s`)}. Kinetic energy?`), answer: E, unit: 'J', unitOpts: ['J', 'N', 'W', 'kg·m/s'],
      steps: [L(`${ex('Eₖ = ½mv²')}`), L(`${ex(`Eₖ = ½ × ${m} × ${v}² = ½ × ${m} × ${v * v}`)}`), L(`${ex(`Eₖ = ${fmt(E)} J`)}`)],
      mistakes: [{ tag: 'half-forgot', value: m * v * v, step: 0 }, { tag: 'square-forgot', value: 0.5 * m * v, step: 0 }], hint: L('Eₖ = ½mv²') };
  }
  const h = ri(2, 45), v = r2(Math.sqrt(2 * G_ * h));
  return { text: L(`ปล่อยวัตถุจากความสูง ${ex(`${h} m`)} ขณะกระทบพื้นมีอัตราเร็วเท่าไร (ทศนิยม 2 ตำแหน่ง)`, `An object is dropped from ${ex(`${h} m`)}. Speed on impact? (2 d.p.)`), note: gNote, answer: v, unit: 'm/s', unitOpts: ['m/s', 'J', 'm/s²', 'm'],
    steps: [L(`กฎอนุรักษ์พลังงาน: ${ex('mgh = ½mv²')}`, `Energy conservation: ${ex('mgh = ½mv²')}`), L(`${ex(`v = √(2gh) = √(2 × ${G_} × ${h}) = √${2 * G_ * h}`)}`), L(`${ex(`v ≈ ${fmt(v, 2)} m/s`)}`)],
    mistakes: [{ tag: 'sqrt-forgot', value: 2 * G_ * h, step: 1 }, { tag: 'half-forgot', value: r2(Math.sqrt(G_ * h)), step: 1 }], hint: L('Eₚ ที่จุดสูงสุด = Eₖ ที่พื้น', 'Eₚ at the top = Eₖ at the bottom') };
}});

def({ id: 'momentum', subject: 'physics', grades: [4], name: L('โมเมนตัมและการชน', 'Momentum & collisions'), gen(lv) {
  if (lv === 1) {
    const m1 = ri(1, 10), m2 = ri(1, 10), u1 = ri(2, 12), v = r2(m1 * u1 / (m1 + m2));
    return { text: L(`รถทดลองมวล ${ex(`${m1} kg`)} วิ่งด้วยความเร็ว ${ex(`${u1} m/s`)} ชนรถมวล ${ex(`${m2} kg`)} ที่จอดนิ่งแล้วติดไปด้วยกัน ความเร็วหลังชนเป็นเท่าไร (ทศนิยม 2 ตำแหน่ง)`, `A ${ex(`${m1} kg`)} cart at ${ex(`${u1} m/s`)} hits a stationary ${ex(`${m2} kg`)} cart and they stick. Speed after? (2 d.p.)`), answer: v, unit: 'm/s', unitOpts: ['m/s', 'kg·m/s', 'm/s²', 'N'],
      steps: [L(`อนุรักษ์โมเมนตัม: ${ex('m₁u₁ + m₂(0) = (m₁ + m₂)v')}`, `Conserve momentum: ${ex('m₁u₁ + m₂(0) = (m₁ + m₂)v')}`), L(`${ex(`v = ${m1} × ${u1} / (${m1} + ${m2}) = ${m1 * u1} / ${m1 + m2}`)}`), L(`${ex(`v ≈ ${fmt(v, 2)} m/s`)}`)],
      mistakes: [{ tag: 'mass-total', value: u1, step: 1 }, { tag: 'mass-total', value: r2(m1 * u1 / m2), step: 1 }], hint: L('ชนแล้วติดกัน ใช้มวลรวม', 'Stuck together → use the combined mass') };
  }
  if (lv === 2) {
    const m1 = ri(2, 10), m2 = ri(2, 10), u1 = ri(3, 12), u2 = ri(2, 10), v = r2((m1 * u1 - m2 * u2) / (m1 + m2));

      steps: [L(`กำหนดขวาเป็นบวก: ${ex(`u_B = −${u2} m/s`)}`, `Right is positive: ${ex(`u_B = −${u2} m/s`)}`), L(`${ex(`(${m1})(${u1}) + (${m2})(−${u2}) = (${m1 + m2})v`)}`), L(`${ex(`v = ${n2s(m1 * u1 - m2 * u2)} / ${m1 + m2} ≈ ${fmt(v, 2)} m/s`)} ${v < 0 ? '(ไปทางซ้าย)' : ''}`, `${ex(`v = ${n2s(m1 * u1 - m2 * u2)} / ${m1 + m2} ≈ ${fmt(v, 2)} m/s`)} ${v < 0 ? '(to the left)' : ''}`)],

    steps: [L(`ทิศสะท้อนเป็นบวก: ${ex(`Δp = m(v − (−u)) = ${m}(${v} + ${u}) = ${fmt(m * (u + v))} kg·m/s`)}`, `Rebound direction +: ${ex(`Δp = m(v − (−u)) = ${m}(${v} + ${u}) = ${fmt(m * (u + v))} kg·m/s`)}`), L(`${ex(`F = Δp / Δt = ${fmt(m * (u + v))} / ${t}`)}`), L(`${ex(`F = ${fmt(F, 2)} N`)}`)],
    mistakes: [{ tag: 'vector-direction', value: r2(m * (u - v) / t), step: 0 }, { tag: 'formula', value: r2(m * (u + v)), step: 1 }], hint: L('ความเร็วก่อนและหลังมีทิศตรงข้าม Δv = v + u', 'Velocities are opposite, so Δv = v + u') };

def({ id: 'circuit', subject: 'physics', grades: [3, 6], name: L('ไฟฟ้ากระแสและวงจร', 'Electric circuits'), gen(lv) {

    const R = [ri(2, 20), ri(2, 20), ri(2, 20)], V = ri(6, 48), Rt = R[0] + R[1] + R[2], I = r2(V / Rt), Rp = 1 / (1 / R[0] + 1 / R[1] + 1 / R[2]);

      diagram: svgCircuit({ kind: 'series', V: `${V} V`, R: R.map(r => `${r} Ω`) }),

  }
  const R1 = pick([2, 3, 4, 6, 8, 10, 12, 15, 20]), R2 = pick([3, 4, 5, 6, 12, 24, 30]), Rt = r2(R1 * R2 / (R1 + R2));

    diagram: svgCircuit({ kind: 'parallel', V: '', R: [`${R1} Ω`, `${R2} Ω`] }),
    steps: [L(`ขนาน: ${ex(`1/R = 1/${R1} + 1/${R2} = ${fmt(1 / R1 + 1 / R2, 4)}`)}`, `Parallel: ${ex(`1/R = 1/${R1} + 1/${R2} = ${fmt(1 / R1 + 1 / R2, 4)}`)}`), L(`กลับเศษส่วน: ${ex(`R = R₁R₂ / (R₁ + R₂) = ${R1 * R2} / ${R1 + R2}`)}`, `Flip it: ${ex(`R = R₁R₂ / (R₁ + R₂) = ${R1 * R2} / ${R1 + R2}`)}`), L(`${ex(`R ≈ ${fmt(Rt, 2)} Ω`)}`)],
    mistakes: [{ tag: 'series-parallel', value: R1 + R2, step: 0 }, { tag: 'reciprocal-forgot', value: r2(1 / R1 + 1 / R2, 3), step: 1 }], hint: L('ขนาน: 1/R = 1/R₁ + 1/R₂ (ค่ารวมน้อยกว่าตัวที่น้อยที่สุด)', 'Parallel: 1/R = 1/R₁ + 1/R₂ (result is below the smallest)') };
}});

def({ id: 'wave', subject: 'physics', grades: [5], name: L('คลื่น', 'Waves'), gen(lv) {

      mistakes: [{ tag: 'unit-convert', value: r2(340 / fk), step: 0 }, { tag: 'formula-swap', value: 340 * fk * 1000, step: 1 }], hint: L('kHz × 1000 = Hz แล้วใช้ λ = v / f', 'kHz × 1000 = Hz, then λ = v / f') };

    mistakes: [{ tag: 'half-forgot', value: r2(n * v / Ls), step: 0 }, { tag: 'harmonic', value: r2(v / (2 * Ls)), step: 1 }], hint: L('เชือกตรึงสองปลาย: f = nv / 2L', 'Fixed both ends: f = nv / 2L') };
}});

/* ===== MATH — multi-step & applied ===== */
const fact = n => (n <= 1 ? 1 : n * fact(n - 1));
const nCr = (n, r) => fact(n) / (fact(r) * fact(n - r));
const nPr = (n, r) => fact(n) / fact(n - r);
const sub = s => `<sub>${s}</sub>`;
const PI_ = 3.14;
const NOTE_FRAC = L('ตอบเป็นเศษส่วนอย่างต่ำ (เช่น 5/6) หรือทศนิยม', 'Answer as a fraction in lowest terms (e.g. 5/6) or a decimal');
const NOTE_2DP = L('ตอบเป็นทศนิยม 2 ตำแหน่ง', 'Answer to 2 decimal places');

def({ id: 'workrate', subject: 'math', grades: [2, 3], name: L('งานและอัตราการทำงาน', 'Work-rate problems'), gen(lv) {
  if (lv === 1) {
    const a = pick([4, 6, 8, 10, 12, 15, 20]), b = nz(3, 20, [a]), t = a * b / (a + b);
    return { text: L(`ช่าง A ทำงานชิ้นหนึ่งคนเดียวเสร็จใน ${ex(a)} วัน ช่าง B ทำงานเดียวกันคนเดียวเสร็จใน ${ex(b)} วัน ถ้าช่วยกันทำจะเสร็จในกี่วัน`, `Worker A alone finishes a job in ${ex(a)} days; worker B alone in ${ex(b)} days. Working together, how many days?`), note: NOTE_FRAC, answer: t, answerText: fracStr(a * b, a + b),
      steps: [L(`อัตราต่อวัน: ${ex(`A = 1/${a}`)}, ${ex(`B = 1/${b}`)}`, `Rate per day: ${ex(`A = 1/${a}`)}, ${ex(`B = 1/${b}`)}`),
        L(`รวมกัน: ${ex(`1/${a} + 1/${b} = ${a + b}/${a * b}`)} งานต่อวัน`, `Combined: ${ex(`1/${a} + 1/${b} = ${a + b}/${a * b}`)} of the job per day`),
        L(`เวลา = 1 ÷ อัตรา: ${ex(`t = ${a * b}/${a + b} = ${fracStr(a * b, a + b)}`)} วัน`, `Time = 1 ÷ rate: ${ex(`t = ${a * b}/${a + b} = ${fracStr(a * b, a + b)}`)} days`)],
      mistakes: [{ tag: 'rate-avg', value: (a + b) / 2, step: 1 }, { tag: 'reciprocal-forgot', value: (a + b) / (a * b), step: 2 }], hint: L('บวกอัตราการทำงานต่อวัน แล้วกลับเศษส่วน', 'Add the daily rates, then flip') };
  }
  if (lv === 2) {
    const a = ri(3, 24), b = nz(3, 24, [a]), c = nz(3, 24, [a, b]), den = b * c + a * c + a * b, t = a * b * c / den;
    return { text: L(`ท่อ 3 ท่อเติมน้ำเต็มสระได้ใน ${ex(a)}, ${ex(b)} และ ${ex(c)} ชั่วโมง ตามลำดับ ถ้าเปิดทั้งสามท่อพร้อมกันจะเต็มสระในกี่ชั่วโมง`, `Three pipes fill a tank alone in ${ex(a)}, ${ex(b)} and ${ex(c)} hours. All three open together — how many hours to fill it?`), note: NOTE_FRAC, answer: t, answerText: fracStr(a * b * c, den),

        L(`รวมอัตรา: ${ex(`1/${a} + 1/${b} + 1/${c} = ${den}/${a * b * c}`)}`, `Combined rate: ${ex(`1/${a} + 1/${b} + 1/${c} = ${den}/${a * b * c}`)}`),
        L(`กลับเศษส่วน: ${ex(`t = ${a * b * c}/${den} = ${fracStr(a * b * c, den)}`)} ชั่วโมง`, `Flip: ${ex(`t = ${a * b * c}/${den} = ${fracStr(a * b * c, den)}`)} hours`)],
      mistakes: [{ tag: 'rate-avg', value: (a + b + c) / 3, step: 1 }, { tag: 'reciprocal-forgot', value: den / (a * b * c), step: 2 }], hint: L('1/t = 1/a + 1/b + 1/c', '1/t = 1/a + 1/b + 1/c') };
  }
  const a = pick([12, 15, 20, 24, 30]), b = nz(8, 30, [a]), d = ri(2, Math.floor(a / 3)), num = d * (a + b) + (a - d) * b, den = a + b, t = num / den;
  return { text: L(`ช่าง A ทำงานชิ้นหนึ่งคนเดียวเสร็จใน ${ex(a)} วัน ช่าง B คนเดียวเสร็จใน ${ex(b)} วัน A เริ่มทำคนเดียวก่อน ${ex(d)} วัน แล้ว B จึงมาช่วย จนงานเสร็จ รวมใช้เวลากี่วันนับจากเริ่มงาน`, `Worker A alone finishes a job in ${ex(a)} days, B alone in ${ex(b)} days. A works alone for ${ex(d)} days, then B joins until it is done. Total days from the start?`), note: NOTE_FRAC, answer: t, answerText: fracStr(num, den),
    steps: [L(`A ทำคนเดียว ${d} วัน ได้ ${ex(`${d}/${a}`)} ของงาน เหลือ ${ex(`${a - d}/${a}`)}`, `A alone for ${d} days does ${ex(`${d}/${a}`)} of the job, leaving ${ex(`${a - d}/${a}`)}`),
      L(`ช่วยกัน: อัตรา ${ex(`1/${a} + 1/${b} = ${a + b}/${a * b}`)} → เวลา ${ex(`(${a - d}/${a}) ÷ (${a + b}/${a * b}) = ${fracStr((a - d) * b, a + b)}`)} วัน`, `Together: rate ${ex(`1/${a} + 1/${b} = ${a + b}/${a * b}`)} → time ${ex(`(${a - d}/${a}) ÷ (${a + b}/${a * b}) = ${fracStr((a - d) * b, a + b)}`)} days`),
      L(`รวม: ${ex(`${d} + ${fracStr((a - d) * b, a + b)} = ${fracStr(num, den)}`)} วัน`, `Total: ${ex(`${d} + ${fracStr((a - d) * b, a + b)} = ${fracStr(num, den)}`)} days`)],
    mistakes: [{ tag: 'work-remaining', value: d + a * b / (a + b), step: 0 }, { tag: 'formula', value: (a - d) * b / (a + b), step: 2 }], hint: L('หางานที่เหลือก่อน แล้วค่อยคิดเวลาที่ทำร่วมกัน อย่าลืมบวกวันที่ A ทำคนเดียว', 'Find the remaining work, time it at the combined rate, and add A’s solo days') };
