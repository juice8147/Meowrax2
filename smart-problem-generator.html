def({ id: 'mixture', subject: 'math', grades: [3], name: L('สารละลายและการผสม', 'Mixtures & concentration'), gen(lv) {
  if (lv === 1) {
    const x = ri(2, 9), y = ri(2, 9), p = pick([10, 20, 30, 40, 60]), q = nz(5, 80, [p, 0]), c = r2((x * p + y * q) / (x + y));
    return { text: L(`ผสมสารละลายเข้มข้น ${ex(`${p}%`)} ปริมาตร ${ex(`${x} L`)} กับสารละลายเข้มข้น ${ex(`${q}%`)} ปริมาตร ${ex(`${y} L`)} สารละลายที่ได้เข้มข้นกี่เปอร์เซ็นต์`, `${ex(`${x} L`)} of ${ex(`${p}%`)} solution is mixed with ${ex(`${y} L`)} of ${ex(`${q}%`)} solution. What percent is the mixture?`), note: NOTE_2DP, answer: c,
      steps: [L(`เนื้อสาร: ${ex(`${x} × ${p}% + ${y} × ${q}% = ${fmt((x * p + y * q) / 100, 3)} L`)}`, `Solute: ${ex(`${x} × ${p}% + ${y} × ${q}% = ${fmt((x * p + y * q) / 100, 3)} L`)}`),
        L(`ปริมาตรรวม ${ex(`${x} + ${y} = ${x + y} L`)}`, `Total volume ${ex(`${x} + ${y} = ${x + y} L`)}`),
        L(`${ex(`(${x * p + y * q}/100) ÷ ${x + y} × 100 ≈ ${fmt(c, 2)}%`)}`)],
      mistakes: [{ tag: 'avg-conc', value: (p + q) / 2, step: 0 }, { tag: 'var-swap', value: r2((x * q + y * p) / (x + y)), step: 0 }], hint: L('ถ่วงน้ำหนักความเข้มข้นด้วยปริมาตร', 'Weight each concentration by its volume') };
  }
  if (lv === 2) {
    const x = ri(2, 10) * 5, p = pick([20, 30, 40, 50, 60]), r = pick([5, 8, 10, 12, 15, 16]), w = r2(x * (p - r) / r);
    return { text: L(`มีสารละลายเข้มข้น ${ex(`${p}%`)} ปริมาตร ${ex(`${x} L`)} ต้องเติมน้ำบริสุทธิ์กี่ลิตรจึงจะเจือจางเหลือ ${ex(`${r}%`)}`, `You have ${ex(`${x} L`)} of ${ex(`${p}%`)} solution. How many litres of pure water must be added to dilute it to ${ex(`${r}%`)}?`), note: NOTE_2DP, answer: w, unit: 'L', unitOpts: ['L', '%', 'kg', 'mL'],
      steps: [L(`เนื้อสารเดิม ${ex(`${x} × ${p}% = ${fmt(x * p / 100, 3)} L`)} (คงที่หลังเติมน้ำ)`, `Solute ${ex(`${x} × ${p}% = ${fmt(x * p / 100, 3)} L`)} stays constant`),
        L(`ให้เติมน้ำ w ลิตร: ${ex(`${fmt(x * p / 100, 3)} = ${r}% × (${x} + w)`)}`, `Add w litres: ${ex(`${fmt(x * p / 100, 3)} = ${r}% × (${x} + w)`)}`),
        L(`${ex(`w = ${x * p}/${r} − ${x} ≈ ${fmt(w, 2)} L`)}`)],
      mistakes: [{ tag: 'mixture-total', value: r2(x * p / r), step: 2 }, { tag: 'mixture-setup', value: r2(x * (p - r) / p), step: 1 }], hint: L('เนื้อสารคงที่ แต่ปริมาตรรวมเพิ่มขึ้น', 'Solute stays the same; the total volume grows') };
  }
  const p = pick([5, 10, 15, 20]), q = pick([50, 60, 70, 80]), r = pick([25, 30, 35, 40]), T = pick([20, 30, 40, 50, 60]), y = r2(T * (r - p) / (q - p));
  return { text: L(`ต้องการสารละลาย ${ex(`${r}%`)} ปริมาตรรวม ${ex(`${T} L`)} โดยผสมสารละลาย ${ex(`${p}%`)} กับ ${ex(`${q}%`)} ต้องใช้สารละลาย ${ex(`${q}%`)} กี่ลิตร`, `To make ${ex(`${T} L`)} of ${ex(`${r}%`)} solution you mix ${ex(`${p}%`)} and ${ex(`${q}%`)} solutions. How many litres of the ${ex(`${q}%`)} solution?`), note: NOTE_2DP, answer: y, unit: 'L', unitOpts: ['L', '%', 'kg', 'mL'],
    steps: [L(`ให้ใช้ ${q}% จำนวน y ลิตร จึงใช้ ${p}% จำนวน ${ex(`${T} − y`)} ลิตร`, `Let y litres be the ${q}%; then ${ex(`${T} − y`)} litres are the ${p}%`),
      L(`เนื้อสาร: ${ex(`${p}%(${T} − y) + ${q}%·y = ${r}% × ${T}`)}`, `Solute: ${ex(`${p}%(${T} − y) + ${q}%·y = ${r}% × ${T}`)}`),
      L(`${ex(`y(${q} − ${p}) = ${T}(${r} − ${p})`)} → ${ex(`y ≈ ${fmt(y, 2)} L`)}`)],
    mistakes: [{ tag: 'var-swap', value: r2(T * (q - r) / (q - p)), step: 1 }, { tag: 'mixture-setup', value: T / 2, step: 1 }], hint: L('ตั้งสมการเนื้อสารรวมแล้วแก้หา y', 'Write one solute equation and solve for y') };
}});

def({ id: 'interest', subject: 'math', grades: [3], name: L('ดอกเบี้ยเชิงเดียวและทบต้น', 'Simple & compound interest'), gen(lv) {
  const P = ri(2, 50) * 1000, r = pick([2, 3, 4, 5, 6, 8, 10]), note = L('ตอบเป็นบาท ทศนิยม 2 ตำแหน่ง', 'Answer in baht, 2 decimal places'), baht = L('บาท', 'baht');
  if (lv === 1) {
    const n = ri(2, 6), I = P * r * n / 100;
    return { text: L(`ฝากเงิน ${ex(P)} บาท ดอกเบี้ยเชิงเดียวร้อยละ ${ex(r)} ต่อปี เมื่อครบ ${ex(n)} ปี จะมีเงินรวมเท่าไร`, `A deposit of ${ex(P)} baht earns ${ex(`${r}%`)} simple interest per year. Total amount after ${ex(n)} years?`), note, tol: 0.5, answer: P + I,
      steps: [L(`${ex(`I = Prn/100 = ${P} × ${r} × ${n} / 100 = ${I}`)} บาท`, `${ex(`I = Prn/100 = ${P} × ${r} × ${n} / 100 = ${I}`)} baht`), L(`${ex(`A = P + I = ${P} + ${I} = ${P + I}`)} บาท`, `${ex(`A = P + I = ${P} + ${I} = ${P + I}`)} baht`)],
      mistakes: [{ tag: 'interest-only', value: I, step: 1 }], hint: L('เงินรวม = เงินต้น + ดอกเบี้ย', 'Amount = principal + interest') };
  }
  if (lv === 2) {
    const n = ri(2, 4), A = r2(P * (1 + r / 100) ** n);
    return { text: L(`ฝากเงิน ${ex(P)} บาท ดอกเบี้ยทบต้นปีละ ${ex(`${r}%`)} เมื่อครบ ${ex(n)} ปี จะมีเงินรวมเท่าไร`, `A deposit of ${ex(P)} baht earns ${ex(`${r}%`)} interest compounded yearly. Total after ${ex(n)} years?`), note, tol: 0.5, answer: A,
      steps: [L(`ตัวคูณต่อปี ${ex(`1 + ${r}/100 = ${fmt(1 + r / 100, 4)}`)}`, `Yearly factor ${ex(`1 + ${r}/100 = ${fmt(1 + r / 100, 4)}`)}`), L(`${ex(`A = ${P} × ${fmt(1 + r / 100, 4)}${sup(n)}`)}`), L(`${ex(`A ≈ ${fmt(A, 2)}`)} ${baht.th}`, `${ex(`A ≈ ${fmt(A, 2)}`)} baht`)],
      mistakes: [{ tag: 'interest-simple', value: P * (1 + r * n / 100), step: 0 }, { tag: 'interest-only', value: r2(A - P), step: 2 }], hint: L('A = P(1 + r)ⁿ', 'A = P(1 + r)ⁿ') };
  }
  const n = ri(2, 4), rr = pick([5, 8, 10]), A = P * (1 + rr / 100) ** n, CI = A - P, SI = P * rr * n / 100, d = r2(CI - SI);
  return { text: L(`เงินต้น ${ex(P)} บาท อัตราร้อยละ ${ex(rr)} ต่อปี นาน ${ex(n)} ปี ดอกเบี้ยทบต้นมากกว่าดอกเบี้ยเชิงเดียวอยู่กี่บาท`, `Principal ${ex(P)} baht at ${ex(`${rr}%`)} per year for ${ex(n)} years. By how many baht does compound interest exceed simple interest?`), note, tol: 0.5, answer: d,
    steps: [L(`ดอกเบี้ยเชิงเดียว ${ex(`${P} × ${rr} × ${n} / 100 = ${fmt(SI, 2)}`)}`, `Simple interest ${ex(`${P} × ${rr} × ${n} / 100 = ${fmt(SI, 2)}`)}`),
      L(`ทบต้น ${ex(`A = ${P} × ${fmt(1 + rr / 100, 4)}${sup(n)} = ${fmt(A, 2)}`)} → ดอกเบี้ย ${ex(fmt(CI, 2))}`, `Compound ${ex(`A = ${P} × ${fmt(1 + rr / 100, 4)}${sup(n)} = ${fmt(A, 2)}`)} → interest ${ex(fmt(CI, 2))}`),
      L(`ผลต่าง ${ex(`${fmt(CI, 2)} − ${fmt(SI, 2)} = ${fmt(d, 2)}`)}`, `Difference ${ex(`${fmt(CI, 2)} − ${fmt(SI, 2)} = ${fmt(d, 2)}`)}`)],
    mistakes: [{ tag: 'interest-simple', value: SI, step: 0 }, { tag: 'interest-diff', value: r2(CI), step: 2 }, { tag: 'interest-only', value: r2(A), step: 2 }], hint: L('หาดอกเบี้ยทั้งสองแบบก่อน แล้วลบกัน', 'Compute both interests, then subtract') };
}});

def({ id: 'log', subject: 'math', grades: [5], name: L('ลอการิทึมและเลขชี้กำลัง', 'Logarithms & exponential equations'), gen(lv) {
  if (lv === 1) {
    const a = pick([2, 3, 5]), k = ri(2, 5), i = ri(1, k - 1), m = a ** i, n = a ** (k - i);
    return { text: L(`จงหาค่าของ ${ex(`log${sub(a)} ${m} + log${sub(a)} ${n}`)}`, `Evaluate ${ex(`log${sub(a)} ${m} + log${sub(a)} ${n}`)}`), answer: k,
      steps: [L(`รวมลอการิทึมฐานเดียวกัน: ${ex(`log${sub(a)}(${m} × ${n}) = log${sub(a)} ${m * n}`)}`, `Combine same-base logs: ${ex(`log${sub(a)}(${m} × ${n}) = log${sub(a)} ${m * n}`)}`),
        L(`${ex(`${m * n} = ${a}${sup(k)}`)}`), L(`${ex(`log${sub(a)} ${a}${sup(k)} = ${k}`)}`)],
      mistakes: [{ tag: 'log-sum', value: Math.log(m + n) / Math.log(a), step: 0 }], hint: L('log a + log b = log(ab)', 'log a + log b = log(ab)') };
  }
  if (lv === 2) {
    const a = pick([2, 3]), b = pick([2, 3]);
    let x, c0, E; do { x = ri(2, 5); c0 = nz(-5, 5); E = b * x + c0; } while (E < 1 || E > 7);
    return { text: L(`จงแก้สมการ ${ex(`${a}${sup(poly([[b, 1], [c0, 0]]))} = ${a ** E}`)} หาค่า x`, `Solve ${ex(`${a}${sup(poly([[b, 1], [c0, 0]]))} = ${a ** E}`)} for x`), answer: x,
      steps: [L(`เขียนทั้งสองข้างเป็นฐานเดียวกัน: ${ex(`${a ** E} = ${a}${sup(E)}`)}`, `Same base on both sides: ${ex(`${a ** E} = ${a}${sup(E)}`)}`),
        L(`เทียบเลขชี้กำลัง: ${ex(`${poly([[b, 1], [c0, 0]])} = ${E}`)}`, `Equate exponents: ${ex(`${poly([[b, 1], [c0, 0]])} = ${E}`)}`),
        L(`${ex(`${poly([[b, 1]])} = ${E - c0}`)} → ${ex(`x = ${x}`)}`)],
      mistakes: [{ tag: 'transpose-sign', value: (E + c0) / b, step: 2 }, { tag: 'inverse-op', value: E - c0, step: 2 }], hint: L('ทำให้ฐานเท่ากัน แล้วเทียบเลขชี้กำลัง', 'Make the bases equal, then equate the exponents') };
  }
  const [a, k, c, X] = pick([[2, 4, 3, 5], [2, 3, 1, 3], [2, 5, 2, 6], [3, 2, 4, 5], [5, 2, 12, 13], [3, 3, 3, 6], [2, 6, 6, 10], [2, 8, 12, 20]]), P = a ** k;
  return { text: L(`จงหาค่า x ที่ทำให้ ${ex(`log${sub(a)}(x − ${c}) + log${sub(a)}(x + ${c}) = ${k}`)} (โดย x > ${c})`, `Find x such that ${ex(`log${sub(a)}(x − ${c}) + log${sub(a)}(x + ${c}) = ${k}`)} (with x > ${c})`), answer: X,
    steps: [L(`รวมลอการิทึม: ${ex(`log${sub(a)}[(x − ${c})(x + ${c})] = ${k}`)}`, `Combine: ${ex(`log${sub(a)}[(x − ${c})(x + ${c})] = ${k}`)}`),
      L(`แปลงเป็นเลขยกกำลัง: ${ex(`x${sup(2)} − ${c * c} = ${a}${sup(k)} = ${P}`)}`, `Convert to a power: ${ex(`x${sup(2)} − ${c * c} = ${a}${sup(k)} = ${P}`)}`),
      L(`${ex(`x${sup(2)} = ${P + c * c}`)} → ${ex(`x = ±${X}`)} เลือกค่าที่ x > ${c}: ${ex(`x = ${X}`)}`, `${ex(`x${sup(2)} = ${P + c * c}`)} → ${ex(`x = ±${X}`)}; keep x > ${c}: ${ex(`x = ${X}`)}`)],
    mistakes: [{ tag: 'log-product', value: P / 2, step: 0 }, { tag: 'sqrt-forgot', value: P + c * c, step: 2 }, { tag: 'sign', value: Math.sqrt(P - c * c), step: 1 }], hint: L('รวมเป็น log เดียว แล้วแปลงเป็นรูปเลขยกกำลัง ตรวจโดเมนตอนท้าย', 'Merge into one log, convert to exponent form, check the domain at the end') };
}});

def({ id: 'combo', subject: 'math', grades: [5], name: L('การนับและการจัดหมู่', 'Counting: permutations & combinations'), gen(lv) {
  if (lv === 1) {
    const n = ri(5, 9), r = ri(2, 4), ans = nPr(n, r);
    return { text: L(`นักเรียน ${ex(n)} คน เลือก ${ex(r)} คนมานั่งเก้าอี้เรียงกัน ${ex(r)} ตัว ได้กี่วิธี`, `${ex(n)} students; choose ${ex(r)} of them to sit in a row of ${ex(r)} chairs. How many ways?`), answer: ans,
      steps: [L('ลำดับสำคัญ → การจัดเรียง', 'Order matters → permutation'), L(`${ex(`P(${n},${r}) = ${n}! / ${n - r}!`)}`), L(`${ex(`= ${ans}`)}`)],
      mistakes: [{ tag: 'perm-comb', value: nCr(n, r), step: 0 }, { tag: 'formula', value: fact(n), step: 1 }], hint: L('nPr = n! / (n − r)!', 'nPr = n! / (n − r)!') };
  }
  if (lv === 2) {
    const m = ri(4, 7), w = ri(3, 6), a = ri(2, 3), b = 2, ans = nCr(m, a) * nCr(w, b);
    return { text: L(`มีชาย ${ex(m)} คน หญิง ${ex(w)} คน ต้องการเลือกกรรมการชุดหนึ่งประกอบด้วยชาย ${ex(a)} คน และหญิง ${ex(b)} คน ได้กี่วิธี`, `From ${ex(m)} men and ${ex(w)} women, choose a committee of ${ex(a)} men and ${ex(b)} women. How many ways?`), answer: ans,
      steps: [L(`เลือกชาย: ${ex(`C(${m},${a}) = ${nCr(m, a)}`)}`, `Men: ${ex(`C(${m},${a}) = ${nCr(m, a)}`)}`), L(`เลือกหญิง: ${ex(`C(${w},${b}) = ${nCr(w, b)}`)}`, `Women: ${ex(`C(${w},${b}) = ${nCr(w, b)}`)}`), L(`ต้องเลือกทั้งสองอย่าง → คูณ: ${ex(`${nCr(m, a)} × ${nCr(w, b)} = ${ans}`)}`, `Both choices are made → multiply: ${ex(`${nCr(m, a)} × ${nCr(w, b)} = ${ans}`)}`)],
      mistakes: [{ tag: 'counting-rule', value: nCr(m, a) + nCr(w, b), step: 2 }, { tag: 'perm-comb', value: nPr(m, a) * nPr(w, b), step: 0 }, { tag: 'formula', value: nCr(m + w, a + b), step: 0 }], hint: L('เลือกแต่ละกลุ่มด้วย C แล้วคูณกัน', 'Choose each group with C, then multiply') };
  }
  const n = ri(5, 8), together = Math.random() < 0.5, T = 2 * fact(n - 1), ans = together ? T : fact(n) - T;
  return { text: L(`คน ${ex(n)} คนยืนเรียงแถว โดย ก. และ ข. ต้อง<b>${together ? 'ยืนติดกัน' : 'ไม่ยืนติดกัน'}</b> ได้กี่วิธี`, `${ex(n)} people stand in a line, with A and B <b>${together ? 'next to each other' : 'not next to each other'}</b>. How many arrangements?`), answer: ans,
    steps: [L(`ติดกัน: มัด ก.+ข. เป็นหนึ่งหน่วย จัด ${n - 1} หน่วย ได้ ${ex(`${n - 1}! = ${fact(n - 1)}`)}`, `Together: glue A+B into one unit; arrange ${n - 1} units: ${ex(`${n - 1}! = ${fact(n - 1)}`)}`),
      L(`สลับ ก.ข. ภายในมัดได้ ${ex('2!')}: ${ex(`2 × ${fact(n - 1)} = ${T}`)}`, `A and B can swap inside the unit (${ex('2!')}): ${ex(`2 × ${fact(n - 1)} = ${T}`)}`),
      L(together ? `คำตอบ ${ex(T)}` : `ไม่ติดกัน = ทั้งหมด − ติดกัน: ${ex(`${n}! − ${T} = ${fact(n)} − ${T} = ${ans}`)}`, together ? `Answer ${ex(T)}` : `Not together = all − together: ${ex(`${n}! − ${T} = ${fact(n)} − ${T} = ${ans}`)}`)],
    mistakes: together ? [{ tag: 'formula', value: fact(n), step: 0 }, { tag: 'half-forgot', value: fact(n - 1), step: 1 }] : [{ tag: 'formula', value: T, step: 2 }, { tag: 'half-forgot', value: fact(n) - fact(n - 1), step: 1 }], hint: L('มัดคนที่ต้องติดกันเป็นหนึ่งหน่วย อย่าลืมสลับที่ภายในมัด', 'Glue the pair into one unit — and remember they can swap inside it') };
}});

def({ id: 'mensur', subject: 'math', grades: [2, 3], name: L('พื้นที่และปริมาตรรูปประกอบ', 'Composite areas & volumes'), gen(lv) {
  const note = L(`ใช้ π = ${PI_} ตอบทศนิยม 2 ตำแหน่ง`, `Use π = ${PI_}; answer to 2 decimal places`);
  if (lv === 1) {
    const w = pick([4, 6, 8, 10, 12]), h = ri(3, 12), r = w / 2, A = r2(w * h + 0.5 * PI_ * r * r);
    return { text: L(`หน้าต่างรูปสี่เหลี่ยมผืนผ้ากว้าง ${ex(`${w} cm`)} สูง ${ex(`${h} cm`)} มีครึ่งวงกลมที่เส้นผ่านศูนย์กลางเท่าความกว้างต่อด้านบน พื้นที่รวมเท่าไร`, `A window is a ${ex(`${w} cm`)} × ${ex(`${h} cm`)} rectangle topped by a semicircle whose diameter equals the width. Total area?`), note, answer: A, unit: 'cm²', unitOpts: ['cm²', 'cm', 'cm³', 'm²'],
      steps: [L(`สี่เหลี่ยม: ${ex(`${w} × ${h} = ${w * h}`)}`, `Rectangle: ${ex(`${w} × ${h} = ${w * h}`)}`), L(`รัศมี ${ex(`r = ${w}/2 = ${r}`)}; ครึ่งวงกลม ${ex(`½πr² = ½ × ${PI_} × ${r}² = ${fmt(0.5 * PI_ * r * r, 3)}`)}`, `Radius ${ex(`r = ${w}/2 = ${r}`)}; semicircle ${ex(`½πr² = ½ × ${PI_} × ${r}² = ${fmt(0.5 * PI_ * r * r, 3)}`)}`), L(`${ex(`${w * h} + ${fmt(0.5 * PI_ * r * r, 3)} ≈ ${fmt(A, 2)} cm²`)}`)],
      mistakes: [{ tag: 'half-forgot', value: r2(w * h + PI_ * r * r), step: 1 }, { tag: 'formula', value: r2(w * h + 0.5 * PI_ * w * w), step: 1 }], hint: L('ครึ่งวงกลม = ½πr² โดย r คือครึ่งหนึ่งของเส้นผ่านศูนย์กลาง', 'Semicircle = ½πr², with r half the diameter') };
  }
  if (lv === 2) {
    const r = ri(3, 15), t = ri(1, 4), R = r + t, A = r2(PI_ * (R * R - r * r));
    return { text: L(`สระน้ำกลมรัศมี ${ex(`${r} m`)} มีทางเดินกว้าง ${ex(`${t} m`)} ล้อมรอบสระ พื้นที่ทางเดินเท่าไร`, `A circular pond of radius ${ex(`${r} m`)} is surrounded by a ${ex(`${t} m`)}-wide path. Area of the path?`), note, answer: A, unit: 'm²', unitOpts: ['m²', 'm', 'm³', 'cm²'],
      steps: [L(`รัศมีนอก ${ex(`R = ${r} + ${t} = ${R}`)}`, `Outer radius ${ex(`R = ${r} + ${t} = ${R}`)}`), L(`${ex(`A = π(R² − r²) = ${PI_} × (${R * R} − ${r * r})`)}`), L(`${ex(`A ≈ ${fmt(A, 2)} m²`)}`)],
      mistakes: [{ tag: 'ring-diff', value: r2(PI_ * t * t), step: 1 }, { tag: 'formula', value: r2(PI_ * R * R), step: 1 }], hint: L('พื้นที่ทางเดิน = วงกลมใหญ่ − วงกลมเล็ก', 'Path = big circle − small circle') };
  }
  const r = ri(2, 6), h = ri(3, 12), V = r2(PI_ * r * r * h + 2 / 3 * PI_ * r ** 3);
  return { text: L(`ถังทรงกระบอกรัศมี ${ex(`${r} cm`)} สูง ${ex(`${h} cm`)} มีครึ่งทรงกลมรัศมีเท่ากันครอบอยู่ด้านบน ปริมาตรรวมเท่าไร`, `A cylinder of radius ${ex(`${r} cm`)} and height ${ex(`${h} cm`)} has a hemisphere of the same radius on top. Total volume?`), note, answer: V, unit: 'cm³', unitOpts: ['cm³', 'cm²', 'cm', 'm³'],
    steps: [L(`ทรงกระบอก: ${ex(`πr²h = ${PI_} × ${r * r} × ${h} = ${fmt(PI_ * r * r * h, 3)}`)}`, `Cylinder: ${ex(`πr²h = ${PI_} × ${r * r} × ${h} = ${fmt(PI_ * r * r * h, 3)}`)}`), L(`ครึ่งทรงกลม: ${ex(`⅔πr³ = ⅔ × ${PI_} × ${r ** 3} = ${fmt(2 / 3 * PI_ * r ** 3, 3)}`)}`, `Hemisphere: ${ex(`⅔πr³ = ⅔ × ${PI_} × ${r ** 3} = ${fmt(2 / 3 * PI_ * r ** 3, 3)}`)}`), L(`${ex(`V ≈ ${fmt(V, 2)} cm³`)}`)],
    mistakes: [{ tag: 'half-forgot', value: r2(PI_ * r * r * h + 4 / 3 * PI_ * r ** 3), step: 1 }, { tag: 'formula', value: r2(PI_ * r * r * h), step: 1 }, { tag: 'formula', value: r2(PI_ * r * r * h + PI_ * r ** 3 / 3), step: 1 }], hint: L('ครึ่งทรงกลม = ½ × (4/3)πr³', 'Hemisphere = ½ × (4/3)πr³') };
}});

def({ id: 'stat', subject: 'math', grades: [3, 6], name: L('สถิติ: ค่าเฉลี่ยและส่วนเบี่ยงเบนมาตรฐาน', 'Statistics: mean & standard deviation'), gen(lv) {
  if (lv === 1) {
    const d = Array.from({ length: 6 }, () => ri(5, 40)), s = d.reduce((x, y) => x + y, 0), m = r2(s / 6);
    return { text: L(`ข้อมูลชุดหนึ่ง: ${ex(d.join(', '))} ค่าเฉลี่ยเลขคณิตเท่าไร`, `For the data ${ex(d.join(', '))}, what is the arithmetic mean?`), note: NOTE_2DP, answer: m,
      steps: [L(`ผลรวม ${ex(`${d.join(' + ')} = ${s}`)}`, `Sum ${ex(`${d.join(' + ')} = ${s}`)}`), L(`${ex(`x̄ = ${s} / 6 ≈ ${fmt(m, 2)}`)}`)],
      mistakes: [{ tag: 'formula', value: r2(s / 5), step: 1 }], hint: L('ค่าเฉลี่ย = ผลรวม ÷ จำนวนข้อมูล', 'Mean = sum ÷ count') };
  }
  if (lv === 2) {
    const n = 5, d = Array.from({ length: 4 }, () => ri(5, 40)), mean = ri(10, 35), x = n * mean - d.reduce((a, b) => a + b, 0);
    if (x < 0) return this.gen(lv);
    return { text: L(`ข้อมูล 5 ค่า คือ ${ex(`${d.join(', ')}`)} และอีกหนึ่งค่า ถ้าค่าเฉลี่ยเลขคณิตของทั้ง 5 ค่าเท่ากับ ${ex(mean)} ค่าที่หายไปคือเท่าไร`, `Five values: ${ex(d.join(', '))} and one more. The mean of all five is ${ex(mean)}. Find the missing value.`), answer: x,
      steps: [L(`ผลรวมทั้งหมด ${ex(`5 × ${mean} = ${5 * mean}`)}`, `Total ${ex(`5 × ${mean} = ${5 * mean}`)}`), L(`ผลรวม 4 ค่าที่ทราบ ${ex(`${d.join(' + ')} = ${d.reduce((a, b) => a + b, 0)}`)}`, `Known four sum ${ex(`${d.join(' + ')} = ${d.reduce((a, b) => a + b, 0)}`)}`), L(`${ex(`x = ${5 * mean} − ${d.reduce((a, b) => a + b, 0)} = ${x}`)}`)],
      mistakes: [{ tag: 'formula', value: 4 * mean - d.reduce((a, b) => a + b, 0), step: 0 }, { tag: 'sign', value: 5 * mean + d.reduce((a, b) => a + b, 0), step: 2 }], hint: L('ผลรวม = ค่าเฉลี่ย × จำนวนข้อมูลทั้งหมด (รวมค่าที่หายไป)', 'Total = mean × count (including the missing value)') };
  }
  let d, s;
  do { d = Array.from({ length: 5 }, () => ri(2, 20)); s = d.reduce((a, b) => a + b, 0); } while (s % 5 !== 0);
  const mu = s / 5, devs = d.map(v => (v - mu) ** 2), ss = devs.reduce((a, b) => a + b, 0), sd = r2(Math.sqrt(ss / 5));
  return { text: L(`จงหาส่วนเบี่ยงเบนมาตรฐาน (ประชากร) ของข้อมูล ${ex(d.join(', '))}`, `Find the population standard deviation of ${ex(d.join(', '))}`), note: NOTE_2DP, answer: sd,
    steps: [L(`ค่าเฉลี่ย ${ex(`μ = ${s}/5 = ${mu}`)}`, `Mean ${ex(`μ = ${s}/5 = ${mu}`)}`), L(`${ex(`Σ(x − μ)² = ${devs.join(' + ')} = ${ss}`)}`), L(`ความแปรปรวน ${ex(`σ² = ${ss}/5 = ${fmt(ss / 5, 3)}`)}`, `Variance ${ex(`σ² = ${ss}/5 = ${fmt(ss / 5, 3)}`)}`), L(`${ex(`σ = √${fmt(ss / 5, 3)} ≈ ${fmt(sd, 2)}`)}`)],
    mistakes: [{ tag: 'sqrt-forgot', value: r2(ss / 5), step: 3 }, { tag: 'sd-n', value: r2(Math.sqrt(ss / 4)), step: 2 }], hint: L('σ = √(Σ(x − μ)² / N)', 'σ = √(Σ(x − μ)² / N)') };
}});

def({ id: 'integral', subject: 'math', grades: [6], name: L('ปริพันธ์จำกัดเขตและพื้นที่', 'Definite integrals & area'), gen(lv) {
  const lim = (L0, b) => `∫${sub(L0)}${sup(b)}`;
  if (lv === 1) {
    const a = pick([2, 4, 6, 8]), c = nz(-6, 6), L0 = ri(1, 3), b = L0 + ri(1, 4), F = x => a * x * x / 2 + c * x, ans = F(b) - F(L0);
    return { text: L(`จงหาค่าของ ${ex(`${lim(L0, b)} (${poly([[a, 1], [c, 0]])}) dx`)}`, `Evaluate ${ex(`${lim(L0, b)} (${poly([[a, 1], [c, 0]])}) dx`)}`), answer: ans,
      steps: [L(`ปริพันธ์ไม่จำกัดเขต ${ex(`F(x) = ${poly([[a / 2, 2], [c, 1]])}`)}`, `Antiderivative ${ex(`F(x) = ${poly([[a / 2, 2], [c, 1]])}`)}`), L(`${ex(`F(${b}) = ${n2s(F(b))}`)}, ${ex(`F(${L0}) = ${n2s(F(L0))}`)}`), L(`${ex(`F(${b}) − F(${L0}) = ${n2s(ans)}`)}`)],
      mistakes: [{ tag: 'integral-limits', value: F(b), step: 2 }, { tag: 'integral-power', value: a * (b * b - L0 * L0) + c * (b - L0), step: 0 }], hint: L('∫ₐᵇ f dx = F(b) − F(a)', '∫ₐᵇ f dx = F(b) − F(a)') };
  }
  if (lv === 2) {
    const c = pick([3, 6, 9, -3, -6]), d = pick([2, 4, 6, -2, -4]), e = nz(-8, 8), L0 = ri(0, 2), b = L0 + ri(1, 3);
    const F = x => c / 3 * x ** 3 + d / 2 * x * x + e * x, ans = F(b) - F(L0);
    return { text: L(`จงหาค่าของ ${ex(`${lim(L0, b)} (${poly([[c, 2], [d, 1], [e, 0]])}) dx`)}`, `Evaluate ${ex(`${lim(L0, b)} (${poly([[c, 2], [d, 1], [e, 0]])}) dx`)}`), answer: ans,
      steps: [L(`หาปริพันธ์ทีละพจน์ ${ex(`F(x) = ${poly([[c / 3, 3], [d / 2, 2], [e, 1]])}`)}`, `Integrate term by term ${ex(`F(x) = ${poly([[c / 3, 3], [d / 2, 2], [e, 1]])}`)}`), L(`${ex(`F(${b}) = ${n2s(F(b))}`)}, ${ex(`F(${L0}) = ${n2s(F(L0))}`)}`), L(`${ex(`${n2s(F(b))} − ${neg(F(L0))} = ${n2s(ans)}`)}`)],
      mistakes: [{ tag: 'integral-power', value: c * (b ** 3 - L0 ** 3) + d * (b * b - L0 * L0) + e * (b - L0), step: 0 }, { tag: 'integral-limits', value: F(b), step: 2 }, { tag: 'sign', value: F(b) + F(L0), step: 2 }], hint: L('เพิ่มเลขชี้กำลังขึ้น 1 แล้วหารด้วยเลขชี้กำลังใหม่', 'Raise the exponent by 1 and divide by the new exponent') };
  }
  const a = pick([1, 2]), b = pick([2, 3, 4, 5, 6]), num = b ** 3, den = 6 * a * a;
  return { text: L(`จงหาพื้นที่ที่ปิดล้อมด้วยกราฟ ${ex(`y = ${a === 1 ? '' : a}x${sup(2)}`)} และเส้นตรง ${ex(`y = ${b}x`)}`, `Find the area enclosed by ${ex(`y = ${a === 1 ? '' : a}x${sup(2)}`)} and the line ${ex(`y = ${b}x`)}`), note: NOTE_FRAC, answer: num / den, answerText: fracStr(num, den),
    steps: [L(`จุดตัด: ${ex(`${a === 1 ? '' : a}x${sup(2)} = ${b}x`)} → ${ex(`x = 0`)} และ ${ex(`x = ${fracStr(b, a)}`)}`, `Intersections: ${ex(`${a === 1 ? '' : a}x${sup(2)} = ${b}x`)} → ${ex(`x = 0`)} and ${ex(`x = ${fracStr(b, a)}`)}`),
      L(`เส้นตรงอยู่บน: ${ex(`A = ∫${sub(0)}${sup(fracStr(b, a))} (${b}x − ${a === 1 ? '' : a}x${sup(2)}) dx`)}`, `The line is above: ${ex(`A = ∫${sub(0)}${sup(fracStr(b, a))} (${b}x − ${a === 1 ? '' : a}x${sup(2)}) dx`)}`),
      L(`${ex(`A = ${b}³ / (6 × ${a * a}) = ${fracStr(num, den)}`)}`)],
    mistakes: [{ tag: 'integral-setup', value: num / (2 * a * a), step: 1 }, { tag: 'integral-setup', value: num / (3 * a * a), step: 1 }], hint: L('พื้นที่ = ∫(เส้นบน − เส้นล่าง) dx จากจุดตัดซ้ายไปขวา', 'Area = ∫(upper − lower) dx between the intersections') };
}});

/* ===== PHYSICS — multi-step & applied ===== */
const sinD = d => Math.sin(d * Math.PI / 180), cosD = d => Math.cos(d * Math.PI / 180);

def({ id: 'incline', subject: 'physics', grades: [4], name: L('ระนาบเอียงและแรงเสียดทาน', 'Inclined plane & friction'), gen(lv) {
  const gNote = L(`ใช้ g = ${G_} m/s² ตอบทศนิยม 2 ตำแหน่ง`, `Use g = ${G_} m/s²; answer to 2 decimal places`);
  if (lv === 1) {
    const th = pick([30, 37, 45, 53, 60]), a = r2(G_ * sinD(th));
    return { text: L(`กล่องไถลลงตามระนาบเอียงลื่นที่เอียง ${ex(`${th}°`)} จากแนวราบ ความเร่งของกล่องเท่าไร`, `A box slides down a frictionless incline at ${ex(`${th}°`)}. Its acceleration?`), note: gNote, answer: a, unit: 'm/s²', unitOpts: ['m/s²', 'm/s', 'N', 'J'],
      steps: [L(`แรงขนานระนาบ ${ex('mg sin θ')} เป็นแรงลัพธ์`, `The force along the slope ${ex('mg sin θ')} is the net force`), L(`${ex(`a = g sin ${th}° = ${G_} × ${fmt(sinD(th), 4)}`)}`), L(`${ex(`a ≈ ${fmt(a, 2)} m/s²`)}`)],
      mistakes: [{ tag: 'trig-ratio', value: r2(G_ * cosD(th)), step: 0 }, { tag: 'formula', value: G_, step: 0 }], hint: L('a = g sin θ', 'a = g sin θ') };
  }
  if (lv === 2) {
    const th = pick([37, 45, 53, 60]), mu = pick([0.1, 0.2, 0.25, 0.3]), a = r2(G_ * (sinD(th) - mu * cosD(th)));
    return { text: L(`กล่องไถลลงตามระนาบเอียง ${ex(`${th}°`)} ที่มีสัมประสิทธิ์ความเสียดทานจลน์ ${ex(`μ = ${mu}`)} ความเร่งของกล่องเท่าไร`, `A box slides down a ${ex(`${th}°`)} incline with kinetic friction ${ex(`μ = ${mu}`)}. Its acceleration?`), note: gNote, answer: a, unit: 'm/s²', unitOpts: ['m/s²', 'm/s', 'N', 'J'],
      steps: [L(`แรงตั้งฉาก ${ex('N = mg cos θ')} ดังนั้นแรงเสียดทาน ${ex('f = μmg cos θ')}`, `Normal force ${ex('N = mg cos θ')}, so friction ${ex('f = μmg cos θ')}`), L(`${ex('ma = mg sin θ − μmg cos θ')} → ${ex('a = g(sin θ − μ cos θ)')}`), L(`${ex(`a = ${G_}(${fmt(sinD(th), 4)} − ${mu} × ${fmt(cosD(th), 4)}) ≈ ${fmt(a, 2)} m/s²`)}`)],
      mistakes: [{ tag: 'vector-direction', value: r2(G_ * (sinD(th) + mu * cosD(th))), step: 1 }, { tag: 'trig-ratio', value: r2(G_ * (sinD(th) - mu)), step: 0 }, { tag: 'net-force', value: r2(G_ * sinD(th)), step: 1 }], hint: L('แรงเสียดทานต้านการเคลื่อนที่ จึงลบออกจากแรงขนานระนาบ', 'Friction opposes motion, so subtract it from the force along the slope') };
  }
  const th = pick([37, 45, 53, 60]), mu = pick([0.1, 0.2, 0.25, 0.3]), d = ri(2, 12), a = G_ * (sinD(th) - mu * cosD(th)), v = r2(Math.sqrt(2 * a * d));
  return { text: L(`ปล่อยกล่องจากหยุดนิ่งบนระนาบเอียง ${ex(`${th}°`)} (${ex(`μ = ${mu}`)}) ไถลลงตามระนาบเป็นระยะ ${ex(`${d} m`)} อัตราเร็วที่ปลายระยะเท่าไร`, `A box is released from rest on a ${ex(`${th}°`)} incline (${ex(`μ = ${mu}`)}) and slides ${ex(`${d} m`)} down the slope. Its speed at the end?`), note: gNote, answer: v, unit: 'm/s', unitOpts: ['m/s', 'm/s²', 'J', 'N'],
    steps: [L(`ความเร่ง ${ex(`a = g(sin θ − μ cos θ) = ${fmt(a, 3)} m/s²`)}`, `Acceleration ${ex(`a = g(sin θ − μ cos θ) = ${fmt(a, 3)} m/s²`)}`), L(`${ex('v² = u² + 2as')} โดย u = 0: ${ex(`v² = 2 × ${fmt(a, 3)} × ${d} = ${fmt(2 * a * d, 3)}`)}`, `${ex('v² = u² + 2as')} with u = 0: ${ex(`v² = 2 × ${fmt(a, 3)} × ${d} = ${fmt(2 * a * d, 3)}`)}`), L(`${ex(`v ≈ ${fmt(v, 2)} m/s`)}`)],
    mistakes: [{ tag: 'net-force', value: r2(Math.sqrt(2 * G_ * sinD(th) * d)), step: 0 }, { tag: 'sqrt-forgot', value: r2(2 * a * d), step: 2 }, { tag: 'half-forgot', value: r2(Math.sqrt(a * d)), step: 1 }], hint: L('หาความเร่งก่อน (รวมแรงเสียดทาน) แล้วใช้ v² = 2as', 'Find the acceleration first (with friction), then use v² = 2as') };
}});

def({ id: 'pulley', subject: 'physics', grades: [4], name: L('รอกและระบบมวลเชื่อมกัน', 'Pulleys & connected masses'), gen(lv) {
  const gNote = L(`ใช้ g = ${G_} m/s² เชือกเบา รอกไม่มีเสียดทาน ตอบทศนิยม 2 ตำแหน่ง`, `Use g = ${G_} m/s²; light rope, frictionless pulley; 2 d.p.`);
  if (lv === 1) {
    const m1 = ri(1, 5), m2 = ri(m1 + 1, 10), a = r2((m2 - m1) * G_ / (m1 + m2));
    return { text: L(`มวล ${ex(`${m1} kg`)} และ ${ex(`${m2} kg`)} แขวนที่ปลายเชือกสองข้างของรอกลื่น ปล่อยให้เคลื่อนที่ ความเร่งของระบบเท่าไร`, `Masses ${ex(`${m1} kg`)} and ${ex(`${m2} kg`)} hang from either end of a rope over a smooth pulley. Acceleration of the system?`), note: gNote, answer: a, unit: 'm/s²', unitOpts: ['m/s²', 'N', 'm/s', 'kg'],
      steps: [L(`แรงลัพธ์ของระบบ ${ex(`(m₂ − m₁)g = (${m2} − ${m1})(${G_}) = ${(m2 - m1) * G_} N`)}`, `Net force on the system ${ex(`(m₂ − m₁)g = (${m2} − ${m1})(${G_}) = ${(m2 - m1) * G_} N`)}`), L(`มวลรวม ${ex(`${m1} + ${m2} = ${m1 + m2} kg`)}`, `Total mass ${ex(`${m1} + ${m2} = ${m1 + m2} kg`)}`), L(`${ex(`a = ${(m2 - m1) * G_} / ${m1 + m2} ≈ ${fmt(a, 2)} m/s²`)}`)],
      mistakes: [{ tag: 'gravity-forgot', value: r2((m2 - m1) / (m1 + m2)), step: 0 }, { tag: 'mass-total', value: r2((m2 - m1) * G_ / m2), step: 1 }], hint: L('a = (m₂ − m₁)g / (m₁ + m₂)', 'a = (m₂ − m₁)g / (m₁ + m₂)') };
  }
  if (lv === 2) {
    const m1 = ri(1, 5), m2 = ri(m1 + 1, 10), T = r2(2 * m1 * m2 * G_ / (m1 + m2));
    return { text: L(`มวล ${ex(`${m1} kg`)} และ ${ex(`${m2} kg`)} แขวนที่ปลายเชือกสองข้างของรอกลื่น แรงตึงเชือกเท่าไร`, `Masses ${ex(`${m1} kg`)} and ${ex(`${m2} kg`)} hang over a smooth pulley. Tension in the rope?`), note: gNote, answer: T, unit: 'N', unitOpts: ['N', 'm/s²', 'kg', 'J'],
      steps: [L(`ความเร่ง ${ex(`a = (m₂ − m₁)g/(m₁ + m₂) = ${fmt((m2 - m1) * G_ / (m1 + m2), 3)} m/s²`)}`, `Acceleration ${ex(`a = (m₂ − m₁)g/(m₁ + m₂) = ${fmt((m2 - m1) * G_ / (m1 + m2), 3)} m/s²`)}`), L(`มวลเบา ${m1} kg ถูกดึงขึ้น: ${ex(`T − m₁g = m₁a`)} → ${ex(`T = m₁(g + a) = ${m1}(${G_} + ${fmt((m2 - m1) * G_ / (m1 + m2), 3)})`)}`, `The lighter ${m1} kg accelerates upward: ${ex(`T − m₁g = m₁a`)} → ${ex(`T = m₁(g + a) = ${m1}(${G_} + ${fmt((m2 - m1) * G_ / (m1 + m2), 3)})`)}`), L(`${ex(`T ≈ ${fmt(T, 2)} N`)}`)],
      mistakes: [{ tag: 'tension-block', value: m2 * G_, step: 1 }, { tag: 'formula', value: (m1 + m2) * G_ / 2, step: 1 }, { tag: 'half-forgot', value: r2(m1 * m2 * G_ / (m1 + m2)), step: 1 }], hint: L('พิจารณามวลก้อนเดียว: แรงตึงและน้ำหนักให้แรงลัพธ์ = ma', 'Isolate one mass: tension and weight give net force = ma') };
  }
  const m1 = ri(2, 8), m2 = ri(3, 10), mu = pick([0.1, 0.2, 0.3]), a = (m2 - mu * m1) * G_ / (m1 + m2), T = r2(m1 * (a + mu * G_));
  return { text: L(`ก้อนมวล ${ex(`${m1} kg`)} อยู่บนโต๊ะที่มีความเสียดทาน ${ex(`μ = ${mu}`)} ผูกเชือกพาดรอกลื่นปลายโต๊ะ ปลายอีกด้านแขวนมวล ${ex(`${m2} kg`)} แรงตึงเชือกเท่าไร`, `A ${ex(`${m1} kg`)} block on a table (friction ${ex(`μ = ${mu}`)}) is tied over a smooth pulley at the table edge to a hanging ${ex(`${m2} kg`)} mass. Tension in the rope?`), note: gNote, answer: T, unit: 'N', unitOpts: ['N', 'm/s²', 'kg', 'J'],
    steps: [L(`ทั้งระบบ: ${ex(`m₂g − μm₁g = (m₁ + m₂)a`)} → ${ex(`a = ${fmt(a, 3)} m/s²`)}`, `Whole system: ${ex(`m₂g − μm₁g = (m₁ + m₂)a`)} → ${ex(`a = ${fmt(a, 3)} m/s²`)}`),
      L(`ก้อนบนโต๊ะ: ${ex(`T − μm₁g = m₁a`)} → ${ex(`T = m₁(a + μg) = ${m1}(${fmt(a, 3)} + ${fmt(mu * G_, 2)})`)}`, `Block on the table: ${ex(`T − μm₁g = m₁a`)} → ${ex(`T = m₁(a + μg) = ${m1}(${fmt(a, 3)} + ${fmt(mu * G_, 2)})`)}`), L(`${ex(`T ≈ ${fmt(T, 2)} N`)}`)],
    mistakes: [{ tag: 'net-force', value: r2(m1 * a), step: 1 }, { tag: 'tension-block', value: m2 * G_, step: 1 }, { tag: 'vector-direction', value: r2(m1 * (a - mu * G_)), step: 1 }], hint: L('เขียน ΣF = ma ของก้อนบนโต๊ะ อย่าลืมแรงเสียดทาน', 'Write ΣF = ma for the table block — include friction') };
}});

def({ id: 'heat', subject: 'physics', grades: [5], name: L('ความร้อนและการผสมสาร', 'Heat & calorimetry'), gen(lv) {
  const cw = 4200, note = L('น้ำมีความจุความร้อนจำเพาะ 4200 J/(kg·K) ตอบทศนิยม 2 ตำแหน่ง', 'Water: c = 4200 J/(kg·K). Answer to 2 d.p.');
  if (lv === 1) {
    const g = ri(1, 10) * 50, T1 = ri(15, 30), T2 = T1 + ri(20, 70), dT = T2 - T1, Q = g / 1000 * cw * dT;
    return { text: L(`ต้มน้ำ ${ex(`${g} g`)} จาก ${ex(`${T1} °C`)} ถึง ${ex(`${T2} °C`)} ต้องใช้พลังงานความร้อนเท่าไร`, `How much heat is needed to warm ${ex(`${g} g`)} of water from ${ex(`${T1} °C`)} to ${ex(`${T2} °C`)}?`), note, answer: Q, unit: 'J', unitOpts: ['J', 'W', '°C', 'kg'],
      steps: [L(`แปลงมวล ${ex(`${g} g = ${g / 1000} kg`)}`, `Convert mass ${ex(`${g} g = ${g / 1000} kg`)}`), L(`${ex(`ΔT = ${T2} − ${T1} = ${dT} K`)}`), L(`${ex(`Q = mcΔT = ${g / 1000} × ${cw} × ${dT} = ${fmt(Q, 2)} J`)}`)],
      mistakes: [{ tag: 'unit-convert', value: g * cw * dT, step: 0 }, { tag: 'formula', value: g / 1000 * cw * T2, step: 1 }], hint: L('Q = mcΔT (มวลหน่วย kg)', 'Q = mcΔT (mass in kg)') };
  }
  if (lv === 2) {
    const m1 = pick([0.5, 1, 1.5, 2, 3]), m2 = pick([0.5, 1, 2, 2.5, 4]), T1 = ri(50, 90), T2 = ri(10, 30), Tf = r2((m1 * T1 + m2 * T2) / (m1 + m2));
    return { text: L(`ผสมน้ำร้อน ${ex(`${m1} kg`)} อุณหภูมิ ${ex(`${T1} °C`)} กับน้ำเย็น ${ex(`${m2} kg`)} อุณหภูมิ ${ex(`${T2} °C`)} อุณหภูมิสุดท้ายเท่าไร (ไม่คิดการสูญเสียความร้อน)`, `${ex(`${m1} kg`)} of water at ${ex(`${T1} °C`)} is mixed with ${ex(`${m2} kg`)} at ${ex(`${T2} °C`)}. Final temperature? (no heat loss)`), note, answer: Tf, unit: '°C', unitOpts: ['°C', 'J', 'K', 'kg'],
      steps: [L(`ความร้อนที่น้ำร้อนเสีย = ที่น้ำเย็นได้: ${ex(`m₁(T₁ − T) = m₂(T − T₂)`)}`, `Heat lost = heat gained: ${ex(`m₁(T₁ − T) = m₂(T − T₂)`)}`), L(`${ex(`T = (m₁T₁ + m₂T₂)/(m₁ + m₂) = (${m1 * T1} + ${m2 * T2}) / ${m1 + m2}`)}`), L(`${ex(`T ≈ ${fmt(Tf, 2)} °C`)}`)],
      mistakes: [{ tag: 'temp-avg', value: (T1 + T2) / 2, step: 0 }, { tag: 'var-swap', value: r2((m1 * T2 + m2 * T1) / (m1 + m2)), step: 1 }], hint: L('อุณหภูมิสุดท้ายอยู่ใกล้ฝั่งที่มวลมากกว่า', 'The result lies closer to the temperature of the larger mass') };
  }
  const mm = pick([0.1, 0.2, 0.3, 0.5]), cm = pick([390, 450, 900]), T1 = ri(150, 300), mw = pick([0.2, 0.3, 0.4, 0.5]), T2 = ri(20, 30), Tf = r2((mm * cm * T1 + mw * cw * T2) / (mm * cm + mw * cw));

def({ id: 'compcirc', subject: 'physics', grades: [3, 6], name: L('วงจรผสมอนุกรม-ขนาน', 'Series-parallel circuits'), gen(lv) {

  $('subjects').innerHTML = ['math', 'physics'].map(k => `<button type="button" class="chip" data-subj="${k}" aria-pressed="${!!S.subjects[k]}">${t(k)}</button>`).join('');
  $('grades').innerHTML = [1, 2, 3, 4, 5, 6].map(g => `<button type="button" class="chip grade" data-grade="${g}" aria-pressed="${S.grades.includes(g)}">${t('gradeP')}${g}</button>`).join('');
  $('diffSeg').innerHTML = ['auto', 'easy', 'medium', 'hard'].map(k => `<input type="radio" name="diff" id="d-${k}" value="${k}" ${S.diff === k ? 'checked' : ''}><label for="d-${k}">${t(k)}</label>`).join('');
  const vis = visibleTopics();
  $('topicList').innerHTML = vis.length ? vis.map(g => `<label class="topic-item"><input type="checkbox" data-topic="${g.id}" ${S.off.includes(g.id) ? '' : 'checked'}><span class="dot ${g.subject}" aria-hidden="true"></span><span>${tr(g.name)}</span><span class="tg">${t('gradeP')}${g.grades.join(',')}</span></label>`).join('') : `<p class="empty">${t('noTopics')}</p>`;
  $('weakToggle').checked = S.weak;
}
function renderProblem() {
  const p = state.p;
  const meta = $('meta'), q = $('qText');
  const form = $('answerForm');
  if (!p) {
    meta.innerHTML = ''; $('reason').innerHTML = ''; q.innerHTML = `<p class="empty" style="margin:0">${t('noTopics')}</p>`; $('qNote').textContent = ''; $('diagram').innerHTML = '';
    form.hidden = true; ['hintBtn', 'solBtn', 'nextBtn'].forEach(id => $(id).disabled = id !== 'nextBtn'); return;
  }
  form.hidden = false; ['hintBtn', 'solBtn', 'nextBtn'].forEach(id => $(id).disabled = false);
  const g = GENERATORS.find(x => x.id === p.topicId);
  const auto = state.settings.diff === 'auto';
  meta.innerHTML = `<span class="badge ${p.subject}">${t(p.subject)}</span><span class="badge">${tr(g.name)}</span><span class="badge lv${p.level}">${t('level')}: ${t(LV[p.level])}${auto ? ' · ' + t('auto') : ''}</span>`;
  const [rk, acc] = state.reason;
  $('reason').innerHTML = `${icon('ic-spark')}<span>${auto || state.settings.weak ? t(rk) + (acc !== null ? ' ' + pctStr(acc) : '') : t('rFixed')}</span>`;
  q.innerHTML = tr(p.text);
  $('qNote').textContent = tr(p.note);
  $('qNote').hidden = !p.note;
  $('diagram').innerHTML = p.diagram || '';
  const sel = $('unitSelect');
  if (p.unit) {
    sel.hidden = false;
    const cur = sel.value;
    sel.innerHTML = `<option value="">${t('chooseUnit')}</option>` + p.unitShuffled.map(u => `<option ${u === cur ? 'selected' : ''}>${u}</option>`).join('');
  } else sel.hidden = true;
  $('suffix').textContent = tr(p.suffix);
  $('submitBtn').disabled = state.solved || state.viewed || state.selfReview;
  $('nextBtn').classList.toggle('pulse', state.solved || state.viewed);
}
function fbBox(kind, ic, title, body) { return `<div class="fb ${kind}">${icon(ic)}<div class="body"><h3>${title}</h3>${body ? `<p>${body}</p>` : ''}</div></div>`; }
function answerDisplay(p) { return (p.answerText ?? fmt(p.answer)) + (p.unit ? ' ' + p.unit : p.suffix ? ' ' + tr(p.suffix) : ''); }
const workImg = cls => `<img class="${cls}" src="${state.photo}" alt="${esc(t('yourWork'))}">`;
function renderPhoto() {
  const th = $('photoThumb');
  th.hidden = !state.photo;
  th.innerHTML = state.photo ? workImg('photo-thumb') : '';
  $('photoRemoveBtn').hidden = !state.photo;
  $('photoBtn').querySelector('span').textContent = t('attachPhoto');
}
function renderFeedback() {
  $('feedback').innerHTML = state.fb.map(f => {
    if (f.type === 'photo') return `<div class="fb info">${icon('ic-camera')}<div class="body"><h3>${t('photoSentT')}</h3><p>${t('photoSentB')}</p>${workImg('work-photo')}<div class="self-grade"><button type="button" class="btn btn-primary" data-self="1">${t('selfRight')}</button><button type="button" class="btn" data-self="0">${t('selfWrong')}</button></div></div></div>`;
    if (f.type === 'self') return fbBox(f.ok ? 'ok' : 'warn', f.ok ? 'ic-check' : 'ic-alert', t(f.ok ? 'selfOkT' : 'selfBadT'), f.ok ? `${t('correctB')} ${ex(answerDisplay(state.p))}` : '');
    if (f.type === 'ok') return fbBox('ok', 'ic-check', t('correctT'), `${t('correctB')} ${ex(answerDisplay(state.p))}`);
    if (f.type === 'hint') return fbBox('info', 'ic-bulb', t('hintT'), tr(state.p.hint));
    if (f.type === 'viewed') return fbBox('warn', 'ic-alert', t('viewedNote'), '');
    if (f.type === 'unit') return fbBox('warn', 'ic-alert', t('unitWrongT'), `${tr(MISTAKES['unit-error'].tip)} — ${t('answerIs')}: ${ex(answerDisplay(state.p))}`);
    // wrong
    let body = '';
    if (f.tag) {
      const M = MISTAKES[f.tag];
      body = `${t('foundMistake')}<b>${state.lang === 'th' ? '' : ' '}${tr(M.label).toLowerCase ? (state.lang === 'en' ? tr(M.label).charAt(0).toLowerCase() + tr(M.label).slice(1) : tr(M.label)) : ''}</b> — ${tr(M.tip)}.`;
      if (f.step != null) body += ` ${t('checkStep')} ${f.step + 1}.`;
    } else body = t('unknownWrong');
    if (f.unitAlso) body += ` (${t('unitAlso')})`;
    if (!state.solved) body += `<br>${t('retry')}`;
    return fbBox('err', 'ic-x', `${t('wrongT')} ${f.value ? '(' + esc(f.value) + ')' : ''}`, body);
  }).join('');
}
function renderSolution() {
  const p = state.p, sec = $('solution');
  if (!p || state.revealed === 0) { sec.hidden = true; return; }
  sec.hidden = false;
  $('solPhoto').innerHTML = state.photo && !state.fb.some(f => f.type === 'photo') ? `<p class="hint-text" style="margin:0">${t('yourWork')}</p>${workImg('work-photo')}` : '';
  const total = p.steps.length + 1;
  const items = p.steps.map((s, i) => `<li class="${i === state.flagStep ? 'flag' : ''}">${tr(s)}${i === state.flagStep ? `<span class="flag-note">${t('flagNote')}</span>` : ''}</li>`);
  items.push(`<li class="final"><b>${t('answerIs')}:</b> ${ex(answerDisplay(p))}</li>`);
  $('steps').innerHTML = items.slice(0, state.revealed).join('');
  $('stepCount').textContent = `${Math.min(state.revealed, total)} / ${total}`;
  $('stepBtn').hidden = $('allStepsBtn').hidden = state.revealed >= total;
}
function renderInsights() {
  const S = state.stats, acc = S.total ? S.correct / S.total : 0;
  $('tiles').innerHTML = `<div class="tile"><b>${S.total}</b><span>${t('attempts')}</span></div><div class="tile"><b>${S.total ? pctStr(acc) : '—'}</b><span>${t('accuracy')}</span></div><div class="tile"><b>${S.streak}</b><span>${t('streak')} · ${t('best')} ${S.best}</span></div>`;
  const rows = GENERATORS.filter(g => tStat(g.id)?.a).map(g => ({ g, s: tStat(g.id), acc: recentAcc(tStat(g.id)) })).sort((a, b) => a.acc - b.acc);
  $('bars').innerHTML = rows.length ? `<ul class="bars">${rows.map(({ g, s, acc }) => {
    const cls = acc < 0.5 ? 'lo' : acc < 0.75 ? 'mid' : 'hi';
    return `<li><span class="nm"><span class="dot ${g.subject}" aria-hidden="true"></span>${tr(g.name)}</span><span class="pct">${pctStr(acc)}</span><span class="track" role="img" aria-label="${pctStr(acc)}"><span class="fill ${cls}" style="width:${Math.max(3, acc * 100)}%;display:block"></span></span><span class="sub">${s.c}/${s.a} ${t('items')} · ${t('level')} ${t(LV[s.lvl])}</span></li>`;
  }).join('')}</ul>` : `<p class="empty">${t('noStats')}</p>`;
  const mk = Object.entries(S.mistakes).sort((a, b) => b[1] - a[1]).slice(0, 5);
  $('mistakes').innerHTML = mk.length ? `<ul class="mk-list">${mk.map(([tag, n]) => `<li><div class="row"><b>${tr(MISTAKES[tag]?.label) || tag}</b><span class="n">×${n}</span></div><p>${tr(MISTAKES[tag]?.tip)}</p></li>`).join('')}</ul>` : `<p class="empty">${S.total ? t('noMistakes') : t('noStats')}</p>`;
}
function renderAll() { applyI18n(); renderSettings(); renderPhoto(); renderProblem(); renderFeedback(); renderSolution(); renderInsights(); }

/* ---------- actions ---------- */
function newProblem() {
  const pick_ = chooseTopic();
  state.attempted = state.solved = state.viewed = state.selfReview = false; state.revealed = 0; state.flagStep = null; state.fb = [];
  state.photo = null; $('photoInput').value = ''; renderPhoto();
  $('answerInput').value = ''; $('answerErr').textContent = ''; $('answerInput').removeAttribute('aria-invalid'); $('unitSelect').value = '';
  if (!pick_) { state.p = null; renderProblem(); renderFeedback(); renderSolution(); return; }
  state.reason = pick_.reason;
  state.p = build(pick_.g, levelFor(pick_.g));
  if (state.p.unit) state.p.unitShuffled = [...state.p.unitOpts].sort(() => Math.random() - 0.5);
  state.lastTopic = pick_.g.id;
  renderProblem(); renderFeedback(); renderSolution();
}
function submit(e) {
  e.preventDefault();
  const p = state.p; if (!p || state.solved || state.viewed || state.selfReview) return;
  const raw = $('answerInput').value, v = parseNum(raw), err = $('answerErr');
  if (!raw.trim() && state.photo) {
    // photo only: no number to diagnose, so show the full solution and let the student self-grade
    err.textContent = ''; $('answerInput').removeAttribute('aria-invalid');
    state.attempted = state.selfReview = true;
    state.fb = state.fb.filter(f => f.type === 'hint'); state.fb.push({ type: 'photo' });
    state.revealed = p.steps.length + 1;
    renderProblem(); renderFeedback(); renderSolution();
    return;
  }
  if (!raw.trim()) { err.textContent = t('errEmpty'); $('answerInput').setAttribute('aria-invalid', 'true'); $('answerInput').focus(); return; }
  if (!isFinite(v)) { err.textContent = t('errNum'); $('answerInput').setAttribute('aria-invalid', 'true'); $('answerInput').focus(); return; }
  const unit = $('unitSelect').value;
  if (p.unit && !unit) { err.textContent = t('errUnit'); $('unitSelect').focus(); return; }
  err.textContent = ''; $('answerInput').removeAttribute('aria-invalid');
  const d = diagnose(p, v), unitOk = !p.unit || unit === p.unit;
  const first = !state.attempted; state.attempted = true;
  state.fb = state.fb.filter(f => f.type === 'hint');
  if (d.correct && unitOk) {
    state.solved = true; state.fb.push({ type: 'ok' });
    if (first) record(true, []);
  } else if (d.correct) {
    state.fb.push({ type: 'unit' });
    if (first) record(false, ['unit-error']);
  } else {
    state.fb.push({ type: 'err', tag: d.mistake?.tag, step: d.mistake?.step, value: raw.trim() + (p.unit && unit ? ' ' + unit : ''), unitAlso: !unitOk });
    state.flagStep = d.mistake?.step ?? null;
    if (first) record(false, [d.mistake?.tag, !unitOk && 'unit-error'].filter(Boolean));
  }
  renderProblem(); renderFeedback(); renderSolution();
  if (state.solved) $('nextBtn').focus();
}
function selfGrade(ok) {
  if (!state.selfReview) return;
  state.selfReview = false;
  if (ok) state.solved = true; else state.viewed = true;
  state.fb = state.fb.filter(f => f.type === 'hint'); state.fb.push({ type: 'self', ok });
  record(ok, []);
  renderProblem(); renderFeedback(); renderSolution();
  $('nextBtn').focus();
}
function attachPhoto(file) {
  const err = $('answerErr');
  if (!file) return;
  if (!file.type.startsWith('image/')) { err.textContent = t('photoErrType'); return; }
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    state.photo = c.toDataURL('image/jpeg', 0.82); err.textContent = ''; renderPhoto();
  };
  img.onerror = () => { URL.revokeObjectURL(url); err.textContent = t('photoErrRead'); };
  img.src = url;
}
function showHint() { if (!state.p || state.fb.some(f => f.type === 'hint')) return; state.fb.unshift({ type: 'hint' }); renderFeedback(); }
function showSolution() {
  const p = state.p; if (!p) return;
  if (!state.attempted && !state.solved) { state.viewed = true; state.attempted = true; record(false, []); state.fb.push({ type: 'viewed' }); renderFeedback(); renderProblem(); }
  state.revealed = Math.max(state.revealed, 1); renderSolution();
  $('solution').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' });
}
let toastTimer;
function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2800); }

/* theme */
function effectiveTheme() { const d = document.documentElement.dataset.theme; return d || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
function updateThemeBtn() { const dark = effectiveTheme() === 'dark'; $('themeIcon').setAttribute('href', dark ? '#ic-sun' : '#ic-moon'); $('themeBtn').setAttribute('aria-label', dark ? t('toLight') : t('toDark')); }
const savedTheme = store.get('smpg-theme', null); if (savedTheme) document.documentElement.dataset.theme = savedTheme;

/* ---------- events ---------- */
$('answerForm').addEventListener('submit', submit);
$('photoBtn').addEventListener('click', () => $('photoInput').click());
$('photoInput').addEventListener('change', e => attachPhoto(e.target.files[0]));
$('photoRemoveBtn').addEventListener('click', () => { state.photo = null; $('photoInput').value = ''; renderPhoto(); });
$('feedback').addEventListener('click', e => { const b = e.target.closest('[data-self]'); if (b) selfGrade(b.dataset.self === '1'); });
$('hintBtn').addEventListener('click', showHint);
$('solBtn').addEventListener('click', showSolution);
$('nextBtn').addEventListener('click', () => { newProblem(); $('answerInput').focus(); });
$('stepBtn').addEventListener('click', () => { state.revealed++; renderSolution(); });
$('allStepsBtn').addEventListener('click', () => { state.revealed = state.p.steps.length + 1; renderSolution(); });
$('langBtn').addEventListener('click', () => { state.lang = state.lang === 'th' ? 'en' : 'th'; store.set('smpg-lang', state.lang); renderAll(); });
$('themeBtn').addEventListener('click', () => { const n = effectiveTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = n; store.set('smpg-theme', n); updateThemeBtn(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', updateThemeBtn);
$('settings').addEventListener('click', e => {
  const S = state.settings, sb = e.target.closest('[data-subj]'), gb = e.target.closest('[data-grade]');
  if (sb) { S.subjects[sb.dataset.subj] = !S.subjects[sb.dataset.subj]; }
  else if (gb) { const g = +gb.dataset.grade; S.grades = S.grades.includes(g) ? S.grades.filter(x => x !== g) : [...S.grades, g]; }
  else if (e.target.id === 'allTopics') S.off = [];
  else if (e.target.id === 'noTopics') S.off = GENERATORS.map(g => g.id);
  else return;
  saveSettings(); renderSettings();
  if (!state.p || !enabledTopics().some(g => g.id === state.p.topicId)) newProblem();
});
$('settings').addEventListener('change', e => {
  const S = state.settings, el = e.target;
  if (el.name === 'diff') { S.diff = el.value; saveSettings(); newProblem(); }
  else if (el.dataset.topic) { const id = el.dataset.topic; S.off = el.checked ? S.off.filter(x => x !== id) : [...S.off, id]; saveSettings(); if (!state.p || !enabledTopics().some(g => g.id === state.p.topicId)) newProblem(); }
  else if (el.id === 'weakToggle') { S.weak = el.checked; saveSettings(); if (S.weak && !GENERATORS.some(g => tStat(g.id)?.a)) toast(t('weakNone')); newProblem(); }
});
$('weakBtn').addEventListener('click', () => {
  if (!GENERATORS.some(g => tStat(g.id)?.a)) { toast(t('weakNone')); return; }
  state.settings.weak = true; saveSettings(); $('weakToggle').checked = true; toast(t('weakOn')); newProblem();
  $('problemCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
$('resetBtn').addEventListener('click', () => { if (!confirm(t('resetQ'))) return; state.stats = blankStats(); saveStats(); renderInsights(); renderProblem(); toast(t('resetDone')); });
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.target.closest('input,select,textarea')) return;
  const k = e.key.toLowerCase();
  if (k === 'n') { e.preventDefault(); $('nextBtn').click(); }
  else if (k === 'h') { e.preventDefault(); showHint(); }
});

renderAll();
newProblem();
</script>
</body>
</html>
